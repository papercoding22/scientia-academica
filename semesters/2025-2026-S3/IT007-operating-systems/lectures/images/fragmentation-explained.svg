<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1220" viewBox="0 0 1680 1220" role="img" aria-labelledby="title desc">
<title id="title">Phân mảnh nội và ngoại: chỗ trống nằm ở đâu?</title>
<desc id="desc">Bên trái: cấp 16 KiB cho process P dùng 13 KiB, còn 3 KiB nằm trong khối đã cấp. Bên phải: ba lỗ 30, 40, 30 KiB bị P1 và P2 ngăn cách; tổng 100 KiB nhưng không cấp được một vùng liên tục 90 KiB. Các ví dụ tự đặt, bỏ qua overhead.</desc>
<defs><pattern id="waste" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#fff0cc"/><path d="M-3 3L3-3M0 12L12 0M9 15L15 9" stroke="#e5bd63" stroke-width="2"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#53697c"/></marker></defs>
<rect x="0" y="0" width="1680" height="1220" rx="0" fill="#f8fafc" stroke="none" stroke-width="2"/>
<text x="48" y="64" font-family="Arial, Helvetica, sans-serif" font-size="40" fill="#22394d" font-weight="700" text-anchor="start">PHÂN MẢNH — NỘI VÀ NGOẠI</text>
<text x="48" y="111" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#526b7e" font-weight="400" text-anchor="start">Chỗ trống bị kẹt trong vùng đã cấp, hoặc nằm rời nhau nên không đủ liền chỗ.</text>
<path d="M48 143H1632" fill="none" stroke="#d7e1e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="44" y="175" width="780" height="859" rx="18" fill="#ffffff" stroke="#dbe4eb" stroke-width="2"/>
<rect x="856" y="175" width="780" height="859" rx="18" fill="#ffffff" stroke="#dbe4eb" stroke-width="2"/>
<text x="80" y="228" font-family="Arial, Helvetica, sans-serif" font-size="36" fill="#946212" font-weight="700" text-anchor="start">NỘI</text>
<text x="80" y="266" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#526b7e" font-weight="400" text-anchor="start">Internal fragmentation (phân mảnh nội)</text>
<text x="892" y="228" font-family="Arial, Helvetica, sans-serif" font-size="36" fill="#247e80" font-weight="700" text-anchor="start">NGOẠI</text>
<text x="892" y="266" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#526b7e" font-weight="400" text-anchor="start">External fragmentation (phân mảnh ngoại)</text>
<text x="80" y="318" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#526b7e" font-weight="700" text-anchor="start">01 · Hình dung bãi đỗ xe</text>
<text x="892" y="318" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#526b7e" font-weight="700" text-anchor="start">01 · Hình dung bãi đỗ xe</text>
<rect x="84" y="344" width="270" height="79" rx="8" fill="#fff8e7" stroke="#d0a045" stroke-width="2"/>
<circle cx="120" cy="391" r="13" fill="#fff" stroke="#247e80" stroke-width="3"/>
<circle cx="193" cy="391" r="13" fill="#fff" stroke="#247e80" stroke-width="3"/>
<path d="M120 391L148 368L172 391H120L137 357H154M148 368H181L193 391M181 368L176 351H163" fill="none" stroke="#247e80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="231" y="357" width="106" height="53" rx="3" fill="url(#waste)" stroke="none" stroke-width="2"/>
<text x="377" y="370" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#22394d" font-weight="400" text-anchor="start">Một xe máy chiếm cả ô lớn.</text>
<text x="377" y="409" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#22394d" font-weight="400" text-anchor="start">Phần dư vẫn thuộc ô đó.</text>
<rect x="896" y="344" width="296" height="79" rx="8" fill="#f5fafb" stroke="#a1bdbc" stroke-width="2"/>
<rect x="948" y="359" width="54" height="48" rx="7" fill="#dbe6ed" stroke="#8399aa" stroke-width="2"/>
<rect x="960" y="365" width="30" height="36" rx="5" fill="#edf3f7" stroke="#8399aa" stroke-width="2"/>
<path d="M975.0 365V401" fill="none" stroke="#8399aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1090" y="359" width="54" height="48" rx="7" fill="#dbe6ed" stroke="#8399aa" stroke-width="2"/>
<rect x="1102" y="365" width="30" height="36" rx="5" fill="#edf3f7" stroke="#8399aa" stroke-width="2"/>
<path d="M1117.0 365V401" fill="none" stroke="#8399aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1220" y="370" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#22394d" font-weight="400" text-anchor="start">Xe rời đi để lại nhiều khe.</text>
<text x="1220" y="409" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#22394d" font-weight="400" text-anchor="start">Xe dài không lọt khe nào.</text>
<path d="M80 453H788" fill="none" stroke="#e2e8ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M892 453H1600" fill="none" stroke="#e2e8ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="80" y="495" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#22394d" font-weight="700" text-anchor="start">02 · Cấp 16 KiB, chỉ cần 13 KiB</text>
<text x="892" y="495" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#22394d" font-weight="700" text-anchor="start">02 · Cần một vùng 90 KiB liên tục</text>
<path d="M88 548V534H776V548" fill="none" stroke="#53697c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="432" y="523" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#22394d" font-weight="400" text-anchor="middle">Toàn bộ khối đã cấp cho P: 16 KiB</text>
<rect x="88" y="566" width="559" height="98" rx="0" fill="#d8efec" stroke="none" stroke-width="2"/>
<rect x="647" y="566" width="129" height="98" rx="0" fill="url(#waste)" stroke="none" stroke-width="2"/>
<rect x="88" y="566" width="688" height="98" rx="0" fill="none" stroke="#344d61" stroke-width="3"/>
<path d="M647 566V664" fill="none" stroke="#344d61" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="367" y="608" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#175b60" font-weight="700" text-anchor="middle">P sử dụng</text>
<text x="367" y="644" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#175b60" font-weight="700" text-anchor="middle">13 KiB</text>
<text x="711.5" y="608" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#80540b" font-weight="700" text-anchor="middle">Thừa</text>
<text x="711.5" y="644" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#80540b" font-weight="700" text-anchor="middle">3 KiB</text>
<path d="M712 672V698H437V718" fill="none" stroke="#53697c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="80" y="756" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#946212" font-weight="700" text-anchor="start">16 − 13 = 3 KiB phân mảnh nội</text>
<text x="80" y="798" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#22394d" font-weight="400" text-anchor="start">3 KiB này nằm bên trong khối đã cấp cho P;</text>
<text x="80" y="835" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#22394d" font-weight="400" text-anchor="start">chưa thể cấp riêng cho process khác.</text>
<text x="892" y="535" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#526b7e" font-weight="400" text-anchor="start">Một đoạn RAM · lỗ trống bị ngăn bởi P1, P2</text>
<rect x="900" y="566" width="159.0" height="98" rx="0" fill="#ffffff" stroke="#718b9f" stroke-width="2"/>
<text x="979.5" y="604" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#247e80" font-weight="700" text-anchor="middle">Trống</text>
<text x="979.5" y="642" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#247e80" font-weight="700" text-anchor="middle">30 KiB</text>
<rect x="1059.0" y="566" width="79.5" height="98" rx="0" fill="#dbe6ed" stroke="#718b9f" stroke-width="2"/>
<text x="1098.75" y="624" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#22394d" font-weight="700" text-anchor="middle">P1</text>
<rect x="1138.5" y="566" width="212.0" height="98" rx="0" fill="#ffffff" stroke="#718b9f" stroke-width="2"/>
<text x="1244.5" y="604" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#247e80" font-weight="700" text-anchor="middle">Trống</text>
<text x="1244.5" y="642" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#247e80" font-weight="700" text-anchor="middle">40 KiB</text>
<rect x="1350.5" y="566" width="79.5" height="98" rx="0" fill="#dbe6ed" stroke="#718b9f" stroke-width="2"/>
<text x="1390.25" y="624" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#22394d" font-weight="700" text-anchor="middle">P2</text>
<rect x="1430.0" y="566" width="159.0" height="98" rx="0" fill="#ffffff" stroke="#718b9f" stroke-width="2"/>
<text x="1509.5" y="604" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#247e80" font-weight="700" text-anchor="middle">Trống</text>
<text x="1509.5" y="642" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#247e80" font-weight="700" text-anchor="middle">30 KiB</text>
<rect x="900" y="686" width="477.0" height="40" rx="6" fill="#fbe9e4" stroke="#c48e7d" stroke-width="2" stroke-dasharray="6 5"/>
<text x="1138.5" y="714" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#963f2f" font-weight="700" text-anchor="middle">Yêu cầu 90 KiB — không lỗ nào đủ</text>
<text x="892" y="765" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#247e80" font-weight="700" text-anchor="start">Tổng trống: 30 + 40 + 30 = 100 KiB</text>
<text x="892" y="803" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#22394d" font-weight="400" text-anchor="start">Lỗ lớn nhất: 40 KiB &lt; 90 KiB → chưa cấp được.</text>
<text x="892" y="841" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#22394d" font-weight="400" text-anchor="start">Các lỗ vẫn có thể phục vụ yêu cầu nhỏ hơn.</text>
<path d="M80 877H788" fill="none" stroke="#e2e8ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M892 877H1600" fill="none" stroke="#e2e8ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="80" y="916" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#526b7e" font-weight="700" text-anchor="start">03 · Quy tắc nhận diện</text>
<text x="892" y="916" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#526b7e" font-weight="700" text-anchor="start">03 · Quy tắc nhận diện</text>
<text x="80" y="962" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#22394d" font-weight="700" text-anchor="start">Vùng đã cấp &gt; vùng yêu cầu;</text>
<text x="80" y="1003" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#946212" font-weight="700" text-anchor="start">phần thừa nằm TRONG vùng đã cấp.</text>
<text x="892" y="962" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#22394d" font-weight="700" text-anchor="start">Tổng trống ≥ yêu cầu, nhưng</text>
<text x="892" y="1003" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#247e80" font-weight="700" text-anchor="start">lỗ lớn nhất &lt; yêu cầu LIÊN TỤC.</text>
<rect x="44" y="1054" width="1592" height="80" rx="12" fill="#eaf0f5" stroke="none" stroke-width="2"/>
<text x="80" y="1103" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#22394d" font-weight="700" text-anchor="start">NHỚ NHANH</text>
<text x="301" y="1103" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#946212" font-weight="700" text-anchor="start">Nội = dư trong khối đã cấp</text>
<path d="M815 1074V1113" fill="none" stroke="#bfceda" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="863" y="1103" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#247e80" font-weight="700" text-anchor="start">Ngoại = đủ tổng, thiếu một vùng liền</text>
<text x="48" y="1173" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62788a" font-weight="400" text-anchor="start">Ví dụ tự đặt · Bỏ qua overhead (chi phí quản lý) · 1 KiB = 1024 byte · Khối RAM vẽ theo tỷ lệ dung lượng.</text>
<text x="48" y="1206" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#62788a" font-weight="400" text-anchor="start">Cơ sở kiến thức: IT007 · Chương 7, trang PDF 31–32. Hình minh họa do AI dựng.</text>
</svg>
