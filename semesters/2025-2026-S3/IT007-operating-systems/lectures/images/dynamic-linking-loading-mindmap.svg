<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="876" viewBox="0 0 1600 876" font-family="Arial, Helvetica, sans-serif" role="img"><title>Mind map — Dynamic linking và dynamic loading</title><rect x="0" y="0" width="1600" height="876" fill="#ffffff" /><text x="40" y="52" font-size="30" fill="#0f172a" text-anchor="start" font-weight="700"><tspan x="40" dy="0">Mind map — Dynamic linking và dynamic loading</tspan></text><text x="40" y="86" font-size="18" fill="#475569" text-anchor="start" font-weight="400"><tspan x="40" dy="0">IT007 · L08 mục 4 · nguồn C7 s24–s27</tspan></text><path d="M 655 493.0 C 627.5 493.0 627.5 245.5 600 245.5" fill="none" stroke="#2563eb" stroke-width="3" /><text x="600" y="233.5" font-size="21" fill="#2563eb" text-anchor="end" font-weight="700"><tspan x="600" dy="0">Là gì?</tspan></text><line x1="600" y1="245.5" x2="340" y2="245.5" stroke="#2563eb" stroke-width="2" /><path d="M 340 245.5 Q 340 185.5 310 185.5" fill="none" stroke="#2563eb" stroke-width="2" /><text x="310" y="151.5" font-size="19" fill="#334155" text-anchor="end" font-weight="400"><tspan x="310" dy="0">Hai cách trì hoãn: đừng</tspan><tspan x="310" dy="25.650000000000002">làm trước việc có thể</tspan><tspan x="310" dy="25.650000000000002">không cần</tspan></text><path d="M 340 245.5 Q 340 259.0 310 259.0" fill="none" stroke="#2563eb" stroke-width="2" /><text x="310" y="252.0" font-size="19" fill="#334155" text-anchor="end" font-weight="400"><tspan x="310" dy="0">Loading hoãn nạp</tspan></text><path d="M 340 245.5 Q 340 319.0 310 319.0" fill="none" stroke="#2563eb" stroke-width="2" /><text x="310" y="298.5" font-size="19" fill="#334155" text-anchor="end" font-weight="400"><tspan x="310" dy="0">Linking hoãn liên kết tới</tspan><tspan x="310" dy="25.650000000000002">module ngoài</tspan></text><path d="M 655 493.0 C 627.5 493.0 627.5 496.5 600 496.5" fill="none" stroke="#9333ea" stroke-width="3" /><text x="600" y="484.5" font-size="21" fill="#9333ea" text-anchor="end" font-weight="700"><tspan x="600" dy="0">Stub</tspan></text><line x1="600" y1="496.5" x2="340" y2="496.5" stroke="#9333ea" stroke-width="2" /><path d="M 340 496.5 Q 340 423.0 310 423.0" fill="none" stroke="#9333ea" stroke-width="2" /><text x="310" y="402.5" font-size="19" fill="#334155" text-anchor="end" font-weight="400"><tspan x="310" dy="0">Load module chứa stub thay</tspan><tspan x="310" dy="25.650000000000002">cho routine ngoài</tspan></text><path d="M 340 496.5 Q 340 483.0 310 483.0" fill="none" stroke="#9333ea" stroke-width="2" /><text x="310" y="476.0" font-size="19" fill="#334155" text-anchor="end" font-weight="400"><tspan x="310" dy="0">Gọi lần đầu: nạp routine</tspan></text><path d="M 340 496.5 Q 340 556.5 310 556.5" fill="none" stroke="#9333ea" stroke-width="2" /><text x="310" y="522.5" font-size="19" fill="#334155" text-anchor="end" font-weight="400"><tspan x="310" dy="0">Tự thay bằng địa chỉ</tspan><tspan x="310" dy="25.650000000000002">routine; lần sau gọi bình</tspan><tspan x="310" dy="25.650000000000002">thường</tspan></text><path d="M 655 493.0 C 627.5 493.0 627.5 734.0 600 734.0" fill="none" stroke="#be123c" stroke-width="3" /><text x="600" y="722.0" font-size="21" fill="#be123c" text-anchor="end" font-weight="700"><tspan x="600" dy="0">Dễ nhầm</tspan></text><line x1="600" y1="734.0" x2="340" y2="734.0" stroke="#be123c" stroke-width="2" /><path d="M 340 734.0 Q 340 674.0 310 674.0" fill="none" stroke="#be123c" stroke-width="2" /><text x="310" y="653.5" font-size="19" fill="#334155" text-anchor="end" font-weight="400"><tspan x="310" dy="0">Loading: user lo ·</tspan><tspan x="310" dy="25.650000000000002">linking: OS lo</tspan></text><path d="M 340 734.0 Q 340 734.0 310 734.0" fill="none" stroke="#be123c" stroke-width="2" /><text x="310" y="727.0" font-size="19" fill="#334155" text-anchor="end" font-weight="400"><tspan x="310" dy="0">Nạp ≠ liên kết</tspan></text><path d="M 340 734.0 Q 340 794.0 310 794.0" fill="none" stroke="#be123c" stroke-width="2" /><text x="310" y="773.5" font-size="19" fill="#334155" text-anchor="end" font-weight="400"><tspan x="310" dy="0">Đề mẫu dùng cái này làm</tspan><tspan x="310" dy="25.650000000000002">nhiễu cho cái kia</tspan></text><path d="M 945 493.0 C 972.5 493.0 972.5 245.5 1000 245.5" fill="none" stroke="#0f766e" stroke-width="3" /><text x="1000" y="233.5" font-size="21" fill="#0f766e" text-anchor="start" font-weight="700"><tspan x="1000" dy="0">Dynamic loading</tspan></text><line x1="1000" y1="245.5" x2="1260" y2="245.5" stroke="#0f766e" stroke-width="2" /><path d="M 1260 245.5 Q 1260 185.5 1290 185.5" fill="none" stroke="#0f766e" stroke-width="2" /><text x="1290" y="165.0" font-size="19" fill="#334155" text-anchor="start" font-weight="400"><tspan x="1290" dy="0">Thủ tục chỉ nạp vào RAM</tspan><tspan x="1290" dy="25.650000000000002">khi được gọi</tspan></text><path d="M 1260 245.5 Q 1260 245.5 1290 245.5" fill="none" stroke="#0f766e" stroke-width="2" /><text x="1290" y="238.5" font-size="19" fill="#334155" text-anchor="start" font-weight="400"><tspan x="1290" dy="0">User chịu trách nhiệm</tspan></text><path d="M 1260 245.5 Q 1260 305.5 1290 305.5" fill="none" stroke="#0f766e" stroke-width="2" /><text x="1290" y="285.0" font-size="19" fill="#334155" text-anchor="start" font-weight="400"><tspan x="1290" dy="0">Hợp mã lớn, ít dùng — vd</tspan><tspan x="1290" dy="25.650000000000002">xử lý lỗi</tspan></text><path d="M 945 493.0 C 972.5 493.0 972.5 469.5 1000 469.5" fill="none" stroke="#b45309" stroke-width="3" /><text x="1000" y="457.5" font-size="21" fill="#b45309" text-anchor="start" font-weight="700"><tspan x="1000" dy="0">Dynamic linking</tspan></text><line x1="1000" y1="469.5" x2="1260" y2="469.5" stroke="#b45309" stroke-width="2" /><path d="M 1260 469.5 Q 1260 409.5 1290 409.5" fill="none" stroke="#b45309" stroke-width="2" /><text x="1290" y="389.0" font-size="19" fill="#334155" text-anchor="start" font-weight="400"><tspan x="1290" dy="0">Link module ngoài sau khi</tspan><tspan x="1290" dy="25.650000000000002">đã tạo load module</tspan></text><path d="M 1260 469.5 Q 1260 469.5 1290 469.5" fill="none" stroke="#b45309" stroke-width="2" /><text x="1290" y="462.5" font-size="19" fill="#334155" text-anchor="start" font-weight="400"><tspan x="1290" dy="0">.DLL · .so</tspan></text><path d="M 1260 469.5 Q 1260 529.5 1290 529.5" fill="none" stroke="#b45309" stroke-width="2" /><text x="1290" y="509.0" font-size="19" fill="#334155" text-anchor="start" font-weight="400"><tspan x="1290" dy="0">Cần OS hỗ trợ stub, kiểm</tspan><tspan x="1290" dy="25.650000000000002">tra chia sẻ</tspan></text><path d="M 945 493.0 C 972.5 493.0 972.5 707.0 1000 707.0" fill="none" stroke="#475569" stroke-width="3" /><text x="1000" y="695.0" font-size="21" fill="#475569" text-anchor="start" font-weight="700"><tspan x="1000" dy="0">Lợi ích</tspan></text><line x1="1000" y1="707.0" x2="1260" y2="707.0" stroke="#475569" stroke-width="2" /><path d="M 1260 707.0 Q 1260 633.5 1290 633.5" fill="none" stroke="#475569" stroke-width="2" /><text x="1290" y="613.0" font-size="19" fill="#334155" text-anchor="start" font-weight="400"><tspan x="1290" dy="0">Loading: mã hiếm dùng</tspan><tspan x="1290" dy="25.650000000000002">không chiếm RAM</tspan></text><path d="M 1260 707.0 Q 1260 693.5 1290 693.5" fill="none" stroke="#475569" stroke-width="2" /><text x="1290" y="686.5" font-size="19" fill="#334155" text-anchor="start" font-weight="400"><tspan x="1290" dy="0">Linking: chia sẻ mã</tspan></text><path d="M 1260 707.0 Q 1260 767.0 1290 767.0" fill="none" stroke="#475569" stroke-width="2" /><text x="1290" y="733.0" font-size="19" fill="#334155" text-anchor="start" font-weight="400"><tspan x="1290" dy="0">Linking: dùng bản thư viện</tspan><tspan x="1290" dy="25.650000000000002">mới không cần biên dịch</tspan><tspan x="1290" dy="25.650000000000002">lại</tspan></text><rect x="655" y="428.0" width="290" height="130" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3" /><text x="800" y="469.0" font-size="24" fill="#0f172a" text-anchor="middle" font-weight="700"><tspan x="800" dy="0">Dynamic</tspan><tspan x="800" dy="32.400000000000006">linking &amp;</tspan><tspan x="800" dy="32.400000000000006">loading</tspan></text></svg>