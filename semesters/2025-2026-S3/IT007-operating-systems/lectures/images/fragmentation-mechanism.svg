<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1160" viewBox="0 0 1760 1160" role="img" aria-labelledby="title desc">
<title id="title">Phân mảnh xuất hiện khi cấp phát và thu hồi bộ nhớ</title>
<desc id="desc">Cùng 48 KiB RAM, A B C mỗi process cần 13 KiB. Fixed partitioning chia ba partition 16 KiB: cấp A B C tạo ba phần dư 3 KiB; khi A C kết thúc chỉ còn B với phần dư 3 KiB. Dynamic partitioning cấp đúng 13 KiB cho mỗi process, đuôi còn 9 KiB; khi A C kết thúc còn hai lỗ 13 và 22 KiB, B giữ nguyên vị trí. D cần 30 KiB liên tục không được cấp dù tổng trống là 35 KiB.</desc>
<defs><pattern id="spare" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#fff1cc"/><path d="M-2 2L2-2M0 10L10 0M8 12L12 8" stroke="#dcb05b" stroke-width="1.5"/></pattern></defs>
