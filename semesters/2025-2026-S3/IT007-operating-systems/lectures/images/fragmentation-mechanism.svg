<text x="48" y="106" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#526b7d" font-weight="400" text-anchor="start">Cùng 48 KiB RAM · A, B, C mỗi process cần 13 KiB · sau đó A và C kết thúc</text>
