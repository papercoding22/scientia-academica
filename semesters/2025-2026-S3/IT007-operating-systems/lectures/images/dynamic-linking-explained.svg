<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260" role="img" aria-labelledby="title desc">
<title id="title">Dynamic linking: lần gọi đầu và những lần sau</title>
<desc id="desc">Ví dụ lazy binding: call printf qua stub, runtime linker tìm địa chỉ, lưu liên kết rồi chạy hàm. Lần sau dùng liên kết đã biết. Hai process có thể chia sẻ trang mã thư viện, nhưng vẫn có dữ liệu riêng.</desc>
<rect x="0" y="0" width="1600" height="1260" rx="0" fill="#f4f7fb" stroke="none" stroke-width="2"/>
<rect x="40" y="30" width="1520" height="142" rx="24" fill="#143a5c" stroke="none" stroke-width="2"/>
<text x="72" y="64" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#a7d5fa" font-weight="600" text-anchor="start">IT007  /  MEMORY MANAGEMENT</text>
<text x="72" y="113" font-family="Arial, Helvetica, sans-serif" font-size="48" fill="#ffffff" font-weight="700" text-anchor="start">DYNAMIC LINKING</text>
<text x="72" y="148" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#e6f3ff" font-weight="400" text-anchor="start">Chương trình nối đến mã thư viện khi nạp hoặc khi chạy.</text>
<rect x="48" y="195" width="1504" height="126" rx="18" fill="#eaf3fd" stroke="none" stroke-width="2"/>
<rect x="82" y="238" width="88" height="46" rx="9" fill="#ffffff" stroke="#2563a6" stroke-width="2"/>
<rect x="96" y="219" width="60" height="37" rx="3" fill="#ffffff" stroke="#2563a6" stroke-width="2"/>
<line x1="105" y1="229" x2="147" y2="229" stroke="#a9cdf4" stroke-width="3" stroke-linecap="round"/>
<line x1="105" y1="238" x2="147" y2="238" stroke="#a9cdf4" stroke-width="3" stroke-linecap="round"/>
<rect x="98" y="270" width="57" height="28" rx="3" fill="#ffffff" stroke="#2563a6" stroke-width="2"/>
<text x="202" y="244" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#2563a6" font-weight="700" text-anchor="start">Giống văn phòng dùng chung một máy in</text>
<text x="202" y="284" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#52667d" font-weight="400" text-anchor="start">Lần đầu hỏi vị trí máy in; lần sau dùng địa chỉ đã biết.</text>
<rect x="48" y="345" width="1504" height="480" rx="18" fill="#ffffff" stroke="#dce5ef" stroke-width="2"/>
<text x="78" y="388" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#2563a6" font-weight="700" text-anchor="start">1  LẦN GỌI ĐẦU</text>
<text x="375" y="388" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#52667d" font-weight="400" text-anchor="start">Ví dụ liên kết lười (lazy binding)</text>
<rect x="70" y="433" width="250" height="168" rx="16" fill="#edf5ff" stroke="#a9cdf4" stroke-width="2"/>
<text x="195" y="470" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#182f48" font-weight="700" text-anchor="middle">Chương trình</text>
<text x="195" y="530" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#52667d" font-weight="500" text-anchor="middle">call printf()</text>
<polygon points="348,517 338.0,522.0 338.0,512.0" fill="#65758b"/>
<line x1="330" y1="517" x2="338.0" y2="517.0" stroke="#65758b" stroke-width="3" stroke-linecap="round"/>
<rect x="360" y="433" width="250" height="168" rx="16" fill="#fff6e5" stroke="#e9cd9d" stroke-width="2"/>
<text x="485" y="470" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#182f48" font-weight="700" text-anchor="middle">Stub</text>
<text x="485" y="530" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#52667d" font-weight="500" text-anchor="middle">Chuyển đến bước</text>
<text x="485" y="567" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#52667d" font-weight="500" text-anchor="middle">tìm địa chỉ</text>
<polygon points="638,517 628.0,522.0 628.0,512.0" fill="#65758b"/>
<line x1="620" y1="517" x2="628.0" y2="517.0" stroke="#65758b" stroke-width="3" stroke-linecap="round"/>
<rect x="650" y="433" width="250" height="168" rx="16" fill="#fff6e5" stroke="#e9cd9d" stroke-width="2"/>
<text x="775" y="470" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#182f48" font-weight="700" text-anchor="middle">Runtime linker</text>
<text x="775" y="500" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#52667d" font-weight="500" text-anchor="middle">+ OS hỗ trợ</text>
<text x="775" y="541" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#52667d" font-weight="500" text-anchor="middle">Tìm printf trong libc</text>
<text x="775" y="574" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#52667d" font-weight="500" text-anchor="middle">Nạp/map nếu cần</text>
<polygon points="928,517 918.0,522.0 918.0,512.0" fill="#65758b"/>
<line x1="910" y1="517" x2="918.0" y2="517.0" stroke="#65758b" stroke-width="3" stroke-linecap="round"/>
<rect x="940" y="433" width="250" height="168" rx="16" fill="#e8f7f2" stroke="#a7dace" stroke-width="2"/>
<text x="1065" y="470" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#182f48" font-weight="700" text-anchor="middle">Lưu liên kết</text>
<text x="1065" y="530" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#52667d" font-weight="500" text-anchor="middle">Ghi địa chỉ</text>
<text x="1065" y="567" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#52667d" font-weight="500" text-anchor="middle">hàm đã tìm</text>
<polygon points="1218,517 1208.0,522.0 1208.0,512.0" fill="#65758b"/>
<line x1="1200" y1="517" x2="1208.0" y2="517.0" stroke="#65758b" stroke-width="3" stroke-linecap="round"/>
<rect x="1230" y="433" width="250" height="168" rx="16" fill="#f0edff" stroke="#c7bef0" stroke-width="2"/>
<text x="1355" y="470" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#182f48" font-weight="700" text-anchor="middle">printf chạy</text>
<text x="1355" y="530" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#52667d" font-weight="500" text-anchor="middle">Mã trong thư viện</text>
<text x="1355" y="567" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#52667d" font-weight="500" text-anchor="middle">được thực thi</text>
<text x="80" y="640" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#52667d" font-weight="400" text-anchor="start">Ví dụ tìm được printf tại 0x7000 — địa chỉ ảo minh họa trong process này.</text>
<text x="80" y="712" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#11756e" font-weight="700" text-anchor="start">2  LẦN SAU</text>
<rect x="285" y="674" width="250" height="88" rx="14" fill="#e8f7f2" stroke="#a7dace" stroke-width="2"/>
<text x="410.0" y="705" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#52667d" font-weight="500" text-anchor="middle">Chương trình</text>
<text x="410.0" y="742" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#11756e" font-weight="700" text-anchor="middle">call printf()</text>
<rect x="655" y="674" width="340" height="88" rx="14" fill="#e8f7f2" stroke="#a7dace" stroke-width="2"/>
<text x="825.0" y="705" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#52667d" font-weight="500" text-anchor="middle">Liên kết đã lưu</text>
<text x="825.0" y="742" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#11756e" font-weight="700" text-anchor="middle">0x7000</text>
<rect x="1120" y="674" width="360" height="88" rx="14" fill="#e8f7f2" stroke="#a7dace" stroke-width="2"/>
<text x="1300.0" y="705" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#52667d" font-weight="500" text-anchor="middle">Mã trong thư viện</text>
<text x="1300.0" y="742" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#11756e" font-weight="700" text-anchor="middle">printf chạy</text>
<polygon points="630,718 620.0,723.0 620.0,713.0" fill="#65758b"/>
<line x1="557" y1="718" x2="620.0" y2="718.0" stroke="#65758b" stroke-width="3" stroke-linecap="round"/>
<polygon points="1095,718 1085.0,723.0 1085.0,713.0" fill="#65758b"/>
<line x1="1017" y1="718" x2="1085.0" y2="718.0" stroke="#65758b" stroke-width="3" stroke-linecap="round"/>
<text x="800" y="801" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#11756e" font-weight="600" text-anchor="middle">Dùng liên kết đã biết; không cần tìm lại địa chỉ hàm ở mỗi lần gọi.</text>
<rect x="48" y="849" width="930" height="210" rx="18" fill="#ffffff" stroke="#dce5ef" stroke-width="2"/>
<text x="78" y="888" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#2563a6" font-weight="700" text-anchor="start">MÃ CÓ THỂ DÙNG CHUNG</text>
<rect x="80" y="910" width="180" height="44" rx="10" fill="#edf5ff" stroke="#a9cdf4" stroke-width="2"/>
<text x="170" y="939" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#2563a6" font-weight="600" text-anchor="middle">Process P1</text>
<rect x="80" y="967" width="180" height="44" rx="10" fill="#edf5ff" stroke="#a9cdf4" stroke-width="2"/>
<text x="170" y="996" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#2563a6" font-weight="600" text-anchor="middle">Process P2</text>
<rect x="507" y="925" width="422" height="90" rx="14" fill="#f0edff" stroke="#c7bef0" stroke-width="2"/>
<text x="718" y="962" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#61529a" font-weight="700" text-anchor="middle">Trang mã thư viện</text>
<text x="718" y="995" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#61529a" font-weight="500" text-anchor="middle">Cùng frame vật lý trong RAM</text>
<line x1="280" y1="932" x2="391" y2="932" stroke="#65758b" stroke-width="3" stroke-linecap="round"/>
<polygon points="492,953 481.19155442390206,955.8596335829138 483.2272257880102,946.06902368887" fill="#65758b"/>
<line x1="391" y1="932" x2="482.2093901059561" y2="950.9643286358919" stroke="#65758b" stroke-width="3" stroke-linecap="round"/>
<line x1="280" y1="989" x2="391" y2="989" stroke="#65758b" stroke-width="3" stroke-linecap="round"/>
<polygon points="492,987 482.100950510593,992.1970009819387 481.9029695208049,982.1989609976375" fill="#65758b"/>
<line x1="391" y1="989" x2="482.00196001569896" y2="987.1979809897881" stroke="#65758b" stroke-width="3" stroke-linecap="round"/>
<text x="326" y="970" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#52667d" font-weight="400" text-anchor="middle">ánh xạ</text>
<text x="78" y="1044" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#52667d" font-weight="400" text-anchor="start">Mỗi process vẫn có dữ liệu riêng.</text>
<rect x="1002" y="849" width="550" height="210" rx="18" fill="#fff6e5" stroke="none" stroke-width="2"/>
<text x="1032" y="888" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#a46312" font-weight="700" text-anchor="start">ĐỪNG NHẦM</text>
<text x="1032" y="925" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#182f48" font-weight="600" text-anchor="start">Linking: nối tham chiếu đến hàm.</text>
<text x="1032" y="962" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#182f48" font-weight="600" text-anchor="start">Loading: đưa mã vào bộ nhớ.</text>
<text x="1032" y="1002" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#52667d" font-weight="400" text-anchor="start">Thư viện có thể đã được nạp</text>
<text x="1032" y="1033" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#52667d" font-weight="400" text-anchor="start">trước lần gọi đầu.</text>
<rect x="48" y="1083" width="1504" height="99" rx="18" fill="#e7eef7" stroke="none" stroke-width="2"/>
<text x="78" y="1118" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#47627f" font-weight="700" text-anchor="start">ĐỊNH NGHĨA DYNAMIC LINKING</text>
<text x="78" y="1156" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#143a5c" font-weight="600" text-anchor="start">Liên kết tới module ngoài sau khi đã tạo load module.</text>
<text x="52" y="1215" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#52667d" font-weight="400" text-anchor="start">Mô hình stub giản lược; hệ thống cũng có thể liên kết ngay lúc khởi động chương trình.</text>
<text x="52" y="1245" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#637890" font-weight="400" text-anchor="start">Kiến thức: L08 mục 4, C7 s24–s25, s27.  •  Hình do AI dựng; địa chỉ và analogy tự đặt.</text>
</svg>