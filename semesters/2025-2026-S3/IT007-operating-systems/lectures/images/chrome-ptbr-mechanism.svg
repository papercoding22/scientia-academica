<text x="80" y="874" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#233b4f" font-weight="700" text-anchor="start">MMU giữ offset 100, tính địa chỉ dữ liệu:</text>
<text x="80" y="916" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#247e80" font-weight="700" text-anchor="start">7 × 4096 + 100 = 28772</text>
