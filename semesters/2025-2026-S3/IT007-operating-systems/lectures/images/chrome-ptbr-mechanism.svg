<text x="958" y="742" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#687d8d" font-weight="700" text-anchor="start">frame number = 7</text>
<rect x="1330" y="570" width="370" height="195" rx="5" fill="#eee3f7" stroke="#7552a1" stroke-width="3"/>
<text x="1348" y="608" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#7552a1" font-weight="700" text-anchor="start">Page table B</text>
<text x="1348" y="646" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#7552a1" font-weight="400" text-anchor="start">Bắt đầu: 45056</text>
<path d="M1330 663H1700" fill="none" stroke="#7552a1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1348" y="699" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#7552a1" font-weight="400" text-anchor="start">Entry p = 1 · tại 45064</text>
<text x="1348" y="742" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#7552a1" font-weight="700" text-anchor="start">frame number = 12</text>
<path d="M1520 777V824" fill="none" stroke="#7552a1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="1513,812 1520,824 1527,812" fill="#7552a1"/>
<text x="1538" y="809" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#7552a1" font-weight="700" text-anchor="start">f = 12</text>
<rect x="940" y="837" width="760" height="95" rx="8" fill="#f8fafc" stroke="#b8cad7" stroke-width="2"/>
<text x="960" y="874" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#233b4f" font-weight="700" text-anchor="start">MMU giữ offset 100, tính địa chỉ dữ liệu:</text>
