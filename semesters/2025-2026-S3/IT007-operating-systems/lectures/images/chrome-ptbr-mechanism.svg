<rect x="1030" y="1002" width="580" height="115" rx="8" fill="#eee3f7" stroke="#7552a1" stroke-width="2"/>
<text x="1055" y="1044" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#7552a1" font-weight="700" text-anchor="start">RAM · frame 12 của Chrome B</text>
