<path d="M865 225V1135" fill="none" stroke="#d7e1e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 8"/>
<text x="48" y="1170" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#233b4f" font-weight="700" text-anchor="start">Đổi process → OS đổi PTBR; hai page table không bị dời sang vị trí khác.</text>
<path d="M48 1199H1712" fill="none" stroke="#d7e1e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M52 1230H97" fill="none" stroke="#b47f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="85,1223 97,1230 85,1237" fill="#b47f20"/>
<text x="112" y="1238" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#536d80" font-weight="400" text-anchor="start">OS ghi thanh ghi</text>
<path d="M425 1230H470" fill="none" stroke="#247e80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="458,1223 470,1230 458,1237" fill="#247e80"/>
<text x="486" y="1238" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#536d80" font-weight="400" text-anchor="start">Luồng tìm entry rồi đọc dữ liệu</text>
<text x="1080" y="1238" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#536d80" font-weight="700" text-anchor="start">Entry ≠ byte dữ liệu cần đọc</text>
<text x="48" y="1280" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#667f90" font-weight="400" text-anchor="start">Page/frame = 4096 byte · Entry = 8 byte · Ánh xạ hợp lệ, page đã ở RAM · Chỉ trích entry p = 1 của mỗi bảng.</text>
<text x="48" y="1311" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#667f90" font-weight="400" text-anchor="start">AI dựng theo ví dụ tự đặt trong L08 và C7 s49–s51; không phải dữ liệu đo từ Chrome, không mô tả đầy đủ phần cứng thực.</text>
