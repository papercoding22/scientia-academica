<polygon points="433,976 440,988 447,976" fill="#247e80"/>
<text x="462" y="972" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#247e80" font-weight="700" text-anchor="start">② Đọc RAM lần 2</text>
<rect x="150" y="1002" width="580" height="115" rx="8" fill="#d8efec" stroke="#247e80" stroke-width="2"/>
<text x="175" y="1044" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#247e80" font-weight="700" text-anchor="start">RAM · frame 7 của Chrome A</text>
<text x="175" y="1088" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#247e80" font-weight="700" text-anchor="start">Đọc byte dữ liệu tại 28772</text>
<text x="940" y="248" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#7552a1" font-weight="700" text-anchor="start">02 · OS cho Chrome B chạy</text>
<rect x="940" y="275" width="760" height="164" rx="12" fill="#eff4f8" stroke="#bcccd8" stroke-width="2"/>
<text x="960" y="307" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#233b4f" font-weight="700" text-anchor="start">CPU</text>
<text x="1263" y="307" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#233b4f" font-weight="700" text-anchor="start">MMU · p = 1, d = 100</text>
<rect x="970" y="329" width="240" height="86" rx="6" fill="#eee3f7" stroke="#7552a1" stroke-width="2"/>
<text x="1090" y="360" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#7552a1" font-weight="700" text-anchor="middle">PTBR</text>
<text x="1090" y="397" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#7552a1" font-weight="700" text-anchor="middle">45056</text>
<path d="M1090 259V318" fill="none" stroke="#b47f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="1083,306 1090,318 1097,306" fill="#b47f20"/>
<text x="1105" y="301" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#946212" font-weight="400" text-anchor="start">OS nạp</text>
<path d="M1224 372H1251" fill="none" stroke="#7552a1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="1239,365 1251,372 1239,379" fill="#7552a1"/>
<text x="1263" y="352" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#536d80" font-weight="400" text-anchor="start">Địa chỉ entry cần đọc:</text>
<text x="1263" y="390" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#7552a1" font-weight="700" text-anchor="start">45056 + 1 × 8 = 45064</text>
<path d="M1560 450V473H1520V556" fill="none" stroke="#7552a1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
