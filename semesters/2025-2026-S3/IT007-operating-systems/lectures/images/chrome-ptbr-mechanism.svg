<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1320" viewBox="0 0 1760 1320" role="img" aria-labelledby="title desc">
<title id="title">PTBR giúp CPU dùng đúng page table của process Chrome đang chạy</title>
<desc id="desc">Hai thời điểm trên cùng một lõi CPU. OS chạy Chrome A với PTBR 40960 rồi chuyển sang Chrome B với PTBR 45056. Cùng địa chỉ ảo 4196 cho page 1, offset 100. Khi TLB miss, A đọc entry 40968 lấy frame 7 rồi đọc dữ liệu 28772; B đọc entry 45064 lấy frame 12 rồi đọc dữ liệu 49252. Cả hai page table giữ nguyên địa chỉ, chỉ bảng được chọn thay đổi.</desc>
<rect x="0" y="0" width="1760" height="1320" rx="0" fill="#fbfcfd" stroke="none" stroke-width="2"/>
<text x="48" y="63" font-family="Arial, Helvetica, sans-serif" font-size="35" fill="#233b4f" font-weight="700" text-anchor="start">PTBR — CHẠY PROCESS NÀO, DÙNG PAGE TABLE CỦA PROCESS ĐÓ</text>
<text x="48" y="108" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#536d80" font-weight="400" text-anchor="start">Ví dụ Chrome · Cùng một lõi CPU, hai thời điểm · Bảng trang một cấp · Cả hai lượt đều TLB miss</text>
<path d="M48 141H1712" fill="none" stroke="#d7e1e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="48" y="186" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#233b4f" font-weight="700" text-anchor="start">Cùng yêu cầu: địa chỉ ảo 4196 = 1 × 4096 + 100 → page 1, offset 100</text>
<text x="60" y="248" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#247e80" font-weight="700" text-anchor="start">01 · OS cho Chrome A chạy</text>
<rect x="60" y="275" width="760" height="164" rx="12" fill="#eff4f8" stroke="#bcccd8" stroke-width="2"/>
<text x="80" y="307" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#233b4f" font-weight="700" text-anchor="start">CPU</text>
<text x="383" y="307" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#233b4f" font-weight="700" text-anchor="start">MMU · p = 1, d = 100</text>
<rect x="90" y="329" width="240" height="86" rx="6" fill="#d8efec" stroke="#247e80" stroke-width="2"/>
<text x="210" y="360" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#247e80" font-weight="700" text-anchor="middle">PTBR</text>
<text x="210" y="397" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#247e80" font-weight="700" text-anchor="middle">40960</text>
<path d="M210 259V318" fill="none" stroke="#b47f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="203,306 210,318 217,306" fill="#b47f20"/>
<text x="225" y="301" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#946212" font-weight="400" text-anchor="start">OS nạp</text>
<path d="M344 372H371" fill="none" stroke="#247e80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="359,365 371,372 359,379" fill="#247e80"/>
<text x="383" y="352" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#536d80" font-weight="400" text-anchor="start">Địa chỉ entry cần đọc:</text>
<text x="383" y="390" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#247e80" font-weight="700" text-anchor="start">40960 + 1 × 8 = 40968</text>
<path d="M680 450V473H36V714H49" fill="none" stroke="#247e80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="37,707 49,714 37,721" fill="#247e80"/>
<text x="60" y="516" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#247e80" font-weight="700" text-anchor="start">① Đọc RAM lần 1: lấy frame number</text>
<text x="60" y="548" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#536d80" font-weight="400" text-anchor="start">Hai page table cùng nằm trong RAM</text>
<rect x="60" y="570" width="370" height="195" rx="5" fill="#d8efec" stroke="#247e80" stroke-width="3"/>
<text x="78" y="608" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#247e80" font-weight="700" text-anchor="start">Page table A</text>
