<text x="78" y="699" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#247e80" font-weight="400" text-anchor="start">Entry p = 1 · tại 40968</text>
<text x="78" y="742" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#247e80" font-weight="700" text-anchor="start">frame number = 7</text>
<rect x="450" y="570" width="370" height="195" rx="5" fill="#f2f5f8" stroke="#687d8d" stroke-width="1.5"/>
