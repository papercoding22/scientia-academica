<text x="940" y="548" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#536d80" font-weight="400" text-anchor="start">Hai page table cùng nằm trong RAM</text>
<rect x="940" y="570" width="370" height="195" rx="5" fill="#f2f5f8" stroke="#687d8d" stroke-width="1.5"/>
