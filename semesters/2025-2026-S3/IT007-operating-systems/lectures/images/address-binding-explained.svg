<rect x="48" y="1026" width="1504" height="132" rx="18" fill="#e7eef7" stroke="none" stroke-width="2"/>
<text x="78" y="1057" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#47627f" font-weight="700" text-anchor="start">QUY TẮC CHÍNH</text>
<text x="78" y="1095" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#143a5c" font-weight="600" text-anchor="start">Address binding = ánh xạ địa chỉ giữa các không gian địa chỉ.</text>
<text x="78" y="1132" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#143a5c" font-weight="500" text-anchor="start">Compile: dịch lại    •    Load: nạp lại    •    Execution: cập nhật ánh xạ</text>
<text x="52" y="1195" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#52667d" font-weight="400" text-anchor="start">Ví dụ cộng base, không phải công thức chung của paging. Địa chỉ tính theo byte.</text>
<text x="52" y="1232" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#637890" font-weight="400" text-anchor="start">Kiến thức: L08 mục 2–3, C7 s13 và s18–s22.  •  Hình do AI dựng; ví dụ và ẩn dụ tự đặt.</text>
