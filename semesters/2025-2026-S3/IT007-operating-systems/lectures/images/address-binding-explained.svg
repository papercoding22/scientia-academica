<text x="1184" y="344" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#11756e" font-weight="600" text-anchor="start">Tra sổ mỗi lần giao thư.</text>
<text x="1184" y="376" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#52667d" font-weight="400" text-anchor="start">Đổi nhà → cập nhật sổ.</text>
