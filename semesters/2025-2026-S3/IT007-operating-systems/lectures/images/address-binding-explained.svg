<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260" role="img" aria-labelledby="title desc">
<title id="title">Address binding: ba thời điểm ánh xạ địa chỉ</title>
<desc id="desc">So sánh compile time, load time và execution time; mô hình relocation cho thấy logical 1000 ánh xạ thành physical 5000 với base 4000, rồi 8000 với base 7000.</desc>
