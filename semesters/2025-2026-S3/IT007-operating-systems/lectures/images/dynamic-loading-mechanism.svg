<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1110" viewBox="0 0 1680 1110" role="img" aria-labelledby="title desc">
<title id="title">Dynamic loading: chưa gọi, gọi và nạp, rồi thực thi</title>
<desc id="desc">Ba trạng thái của cùng process P. Ban đầu main đã ở RAM, thủ tục xử lý lỗi R còn trên đĩa. Khi main gọi R lần đầu, chương trình nạp mã R từ đĩa vào RAM rồi CPU thực thi R. Bản trên đĩa vẫn còn. Mũi tên liền là nạp mã; nét đứt là luồng thực thi.</desc>
