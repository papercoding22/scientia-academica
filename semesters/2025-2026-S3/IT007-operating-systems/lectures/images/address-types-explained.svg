<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1320" viewBox="0 0 1600 1320" role="img" aria-labelledby="title desc">
<title id="title">Các kiểu địa chỉ nhớ</title>
<desc id="desc">Biến a đi từ symbolic trong source, qua relative 2388 trong load module, tới physical 22388 trong RAM khi nạp tại 20000; bảng chốt symbolic, logical, relative, physical, absolute.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#65758b"/></marker><marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563a6"/></marker></defs>
<rect x="0" y="0" width="1600" height="1320" rx="0" fill="#f4f7fb" stroke="none" stroke-width="2"/>
<rect x="40" y="30" width="1520" height="142" rx="24" fill="#143a5c" stroke="none" stroke-width="2"/>
<text x="72" y="64" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#a7d5fa" font-weight="600" text-anchor="start">IT007  /  MEMORY MANAGEMENT</text>
<text x="72" y="113" font-family="Arial, Helvetica, sans-serif" font-size="48" fill="#ffffff" font-weight="700" text-anchor="start">CÁC KIỂU ĐỊA CHỈ NHỚ</text>
<text x="72" y="148" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#e6f3ff" font-weight="400" text-anchor="start">Cùng một biến a — mỗi bước gọi bằng một kiểu địa chỉ khác nhau.</text>
<text x="48" y="222" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#143a5c" font-weight="700" text-anchor="start">① Hành trình của biến a qua các bước  [C7 s16]</text>
<rect x="48" y="244" width="346" height="236" rx="18" fill="#ffffff" stroke="#dce5ef" stroke-width="2"/>
<rect x="64" y="262" width="45" height="40" rx="10" fill="#6b4fa3" stroke="none" stroke-width="2"/>
<text x="86.5" y="290" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#fff" font-weight="700" text-anchor="middle">01</text>
<text x="122" y="284" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#6b4fa3" font-weight="700" text-anchor="start">SOURCE</text>
<text x="122" y="308" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#52667d" font-weight="400" text-anchor="start">main.c</text>
<rect x="64" y="328" width="314" height="50" rx="8" fill="#f7f9fc" stroke="#cfd9e5" stroke-width="2"/>
<text x="221.0" y="361" font-family="Menlo, Consolas, monospace" font-size="22" fill="#182f48" font-weight="700" text-anchor="middle">add(a, b)</text>
<rect x="64" y="392" width="314" height="70" rx="10" fill="#f2edfb" stroke="none" stroke-width="2"/>
<text x="221.0" y="420" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#6b4fa3" font-weight="700" text-anchor="middle">SYMBOLIC</text>
<text x="221.0" y="448" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#182f48" font-weight="400" text-anchor="middle">gọi bằng tên biến, tên hàm</text>
<line x1="398" y1="362.0" x2="428" y2="362.0" stroke="#65758b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="434" y="244" width="346" height="236" rx="18" fill="#ffffff" stroke="#dce5ef" stroke-width="2"/>
<rect x="450" y="262" width="45" height="40" rx="10" fill="#6b4fa3" stroke="none" stroke-width="2"/>
<text x="472.5" y="290" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#fff" font-weight="700" text-anchor="middle">02</text>
<text x="508" y="284" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#6b4fa3" font-weight="700" text-anchor="start">SAU COMPILE</text>
<text x="508" y="308" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#52667d" font-weight="400" text-anchor="start">main.obj</text>
<rect x="450" y="328" width="314" height="50" rx="8" fill="#f7f9fc" stroke="#cfd9e5" stroke-width="2"/>
<text x="607.0" y="361" font-family="Menlo, Consolas, monospace" font-size="22" fill="#182f48" font-weight="700" text-anchor="middle">MOVE R1, (a)</text>
<rect x="450" y="392" width="314" height="70" rx="10" fill="#f2edfb" stroke="none" stroke-width="2"/>
<text x="607.0" y="420" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#6b4fa3" font-weight="700" text-anchor="middle">VẪN LÀ TÊN</text>
<text x="607.0" y="448" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#182f48" font-weight="400" text-anchor="middle">chưa có vị trí — chờ link</text>
<line x1="784" y1="362.0" x2="814" y2="362.0" stroke="#65758b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="820" y="244" width="346" height="236" rx="18" fill="#ffffff" stroke="#dce5ef" stroke-width="2"/>
<rect x="836" y="262" width="45" height="40" rx="10" fill="#2563a6" stroke="none" stroke-width="2"/>
<text x="858.5" y="290" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#fff" font-weight="700" text-anchor="middle">03</text>
<text x="894" y="284" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#2563a6" font-weight="700" text-anchor="start">SAU LINK</text>
<text x="894" y="308" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#52667d" font-weight="400" text-anchor="start">cal.exe (load module)</text>
<rect x="836" y="328" width="314" height="50" rx="8" fill="#f7f9fc" stroke="#cfd9e5" stroke-width="2"/>
<text x="993.0" y="361" font-family="Menlo, Consolas, monospace" font-size="22" fill="#182f48" font-weight="700" text-anchor="middle">MOVE R1, (2388)</text>
<rect x="836" y="392" width="314" height="70" rx="10" fill="#edf5ff" stroke="none" stroke-width="2"/>
<text x="993.0" y="420" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#2563a6" font-weight="700" text-anchor="middle">RELATIVE → LOGICAL</text>
<text x="993.0" y="448" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#182f48" font-weight="400" text-anchor="middle">cách đầu module 2388</text>
<line x1="1170" y1="362.0" x2="1200" y2="362.0" stroke="#65758b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1206" y="244" width="346" height="236" rx="18" fill="#ffffff" stroke="#dce5ef" stroke-width="2"/>
<rect x="1222" y="262" width="45" height="40" rx="10" fill="#11756e" stroke="none" stroke-width="2"/>
<text x="1244.5" y="290" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#fff" font-weight="700" text-anchor="middle">04</text>
<text x="1280" y="284" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#11756e" font-weight="700" text-anchor="start">SAU LOAD</text>
<text x="1280" y="308" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#52667d" font-weight="400" text-anchor="start">trong RAM</text>
<rect x="1222" y="328" width="314" height="50" rx="8" fill="#f7f9fc" stroke="#cfd9e5" stroke-width="2"/>
<text x="1379.0" y="361" font-family="Menlo, Consolas, monospace" font-size="22" fill="#182f48" font-weight="700" text-anchor="middle">MOVE R1, (22388)</text>
<rect x="1222" y="392" width="314" height="70" rx="10" fill="#e8f7f2" stroke="none" stroke-width="2"/>
<text x="1379.0" y="420" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#11756e" font-weight="700" text-anchor="middle">PHYSICAL / ABSOLUTE</text>
<text x="1379.0" y="448" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#182f48" font-weight="400" text-anchor="middle">2388 + 20000 (địa chỉ nạp)</text>
<text x="48" y="540" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#143a5c" font-weight="700" text-anchor="start">② Logical ở phía chương trình, physical ở phía RAM</text>
<rect x="48" y="560" width="640" height="380" rx="18" fill="#ffffff" stroke="#2563a6" stroke-width="2"/>
<text x="72" y="600" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#2563a6" font-weight="700" text-anchor="start">PHÍA CHƯƠNG TRÌNH</text>
<text x="72" y="630" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#182f48" font-weight="600" text-anchor="start">Logical address (địa chỉ luận lý, còn gọi virtual)</text>
<rect x="120" y="660" width="190" height="250" rx="6" fill="#edf5ff" stroke="#2563a6" stroke-width="2"/>
<text x="215.0" y="652" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#52667d" font-weight="400" text-anchor="middle">load module</text>
<text x="110" y="678" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#2563a6" font-weight="700" text-anchor="end">0</text>
<rect x="120" y="792" width="190" height="36" rx="4" fill="#2563a6" stroke="none" stroke-width="2"/>
<text x="215.0" y="817" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">a</text>
<text x="110" y="817" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#2563a6" font-weight="700" text-anchor="end">2388</text>
<line x1="324" y1="660" x2="324" y2="792" stroke="#2563a6" stroke-width="2" marker-start="url(#arrowb)" marker-end="url(#arrowb)"/>
<text x="336" y="730" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2563a6" font-weight="600" text-anchor="start">đo từ mốc</text>
<text x="336" y="754" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2563a6" font-weight="600" text-anchor="start">= đầu module</text>
<rect x="360" y="845" width="306" height="76" rx="10" fill="#edf5ff" stroke="none" stroke-width="2"/>
<text x="376" y="874" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2563a6" font-weight="700" text-anchor="start">Relative (relocatable) =</text>
<text x="376" y="902" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#182f48" font-weight="400" text-anchor="start">một kiểu logical, tính từ mốc</text>
<line x1="700" y1="810" x2="900" y2="810" stroke="#a46312" stroke-width="4" marker-end="url(#arrow)"/>
<text x="800" y="766" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#a46312" font-weight="700" text-anchor="middle">+ 20000</text>
<text x="800" y="792" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#a46312" font-weight="600" text-anchor="middle">địa chỉ nạp</text>
<text x="800" y="846" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#182f48" font-weight="400" text-anchor="middle">2388 + 20000</text>
<text x="800" y="870" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#182f48" font-weight="700" text-anchor="middle">= 22388</text>
<rect x="912" y="560" width="640" height="380" rx="18" fill="#ffffff" stroke="#11756e" stroke-width="2"/>
<text x="936" y="600" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#11756e" font-weight="700" text-anchor="start">PHÍA RAM</text>
<text x="936" y="630" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#182f48" font-weight="600" text-anchor="start">Physical address (địa chỉ vật lý, địa chỉ thực)</text>
<rect x="1060" y="660" width="190" height="90" rx="4" fill="#eef1f5" stroke="#b8c4d2" stroke-width="2" stroke-dasharray="6 5"/>
<text x="1155.0" y="702" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#52667d" font-weight="400" text-anchor="middle">tiến trình khác</text>
<text x="1155.0" y="726" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#52667d" font-weight="400" text-anchor="middle">…</text>
<rect x="1060" y="750" width="190" height="160" rx="4" fill="#e8f7f2" stroke="#11756e" stroke-width="2"/>
<text x="1155.0" y="778" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#11756e" font-weight="600" text-anchor="middle">tiến trình này</text>
<text x="1050" y="678" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#52667d" font-weight="700" text-anchor="end">0</text>
<text x="1050" y="756" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#11756e" font-weight="700" text-anchor="end">20000</text>
<rect x="1060" y="792" width="190" height="36" rx="4" fill="#11756e" stroke="none" stroke-width="2"/>
<text x="1155.0" y="817" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">a</text>
<text x="1050" y="817" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#11756e" font-weight="700" text-anchor="end">22388</text>
<text x="1155.0" y="934" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#52667d" font-weight="400" text-anchor="middle">RAM</text>
<rect x="1290" y="680" width="244" height="120" rx="10" fill="#e8f7f2" stroke="none" stroke-width="2"/>
<text x="1306" y="710" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#11756e" font-weight="700" text-anchor="start">Absolute address</text>
<text x="1306" y="736" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#182f48" font-weight="400" text-anchor="start">≈ physical:</text>
<text x="1306" y="762" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#182f48" font-weight="400" text-anchor="start">tương đương</text>
<text x="1306" y="786" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#182f48" font-weight="400" text-anchor="start">địa chỉ thực</text>
<rect x="1290" y="818" width="244" height="100" rx="10" fill="#fff7e8" stroke="none" stroke-width="2"/>
<text x="1306" y="848" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#a46312" font-weight="700" text-anchor="start">CPU truy cập</text>
<text x="1306" y="874" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#182f48" font-weight="400" text-anchor="start">ô thật 22388;</text>
<text x="1306" y="900" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#182f48" font-weight="400" text-anchor="start">chương trình cầm 2388</text>
<rect x="48" y="960" width="1504" height="64" rx="14" fill="#fff7e8" stroke="#f1d9a8" stroke-width="2"/>
<text x="72" y="1000" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#a46312" font-weight="700" text-anchor="start">Analogy:</text>
<text x="170" y="1000" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#182f48" font-weight="400" text-anchor="start">“phòng 12 của tầng mình” (relative) + tầng bắt đầu ở phòng 500 → “phòng 512 của khách sạn” (physical).</text>
<text x="48" y="1068" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#143a5c" font-weight="700" text-anchor="start">③ Chốt thuật ngữ  [C7 s12, s18]</text>
<rect x="48" y="1084" width="1504" height="184" rx="14" fill="#ffffff" stroke="#dce5ef" stroke-width="2"/>
<rect x="64" y="1096" width="14" height="28" rx="3" fill="#6b4fa3" stroke="none" stroke-width="2"/>
<text x="92" y="1118" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#6b4fa3" font-weight="700" text-anchor="start">Symbolic</text>
<text x="430" y="1118" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#182f48" font-weight="400" text-anchor="start">tên trong source: biến, hàm</text>
<text x="1060" y="1118" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#52667d" font-weight="600" text-anchor="start">vd: a, add</text>
<line x1="64" y1="1132" x2="1536" y2="1132" stroke="#e3eaf2" stroke-width="1"/>
<rect x="64" y="1140" width="14" height="28" rx="3" fill="#2563a6" stroke="none" stroke-width="2"/>
<text x="92" y="1162" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2563a6" font-weight="700" text-anchor="start">Logical (virtual)</text>
<text x="430" y="1162" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#182f48" font-weight="400" text-anchor="start">vị trí diễn tả trong chương trình</text>
<text x="1060" y="1162" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#52667d" font-weight="600" text-anchor="start">vd: 2388</text>
<line x1="64" y1="1176" x2="1536" y2="1176" stroke="#e3eaf2" stroke-width="1"/>
<rect x="64" y="1184" width="14" height="28" rx="3" fill="#2563a6" stroke="none" stroke-width="2"/>
<text x="92" y="1206" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#2563a6" font-weight="700" text-anchor="start">Relative (relocatable)</text>
<text x="430" y="1206" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#182f48" font-weight="400" text-anchor="start">logical tính từ một mốc</text>
<text x="1060" y="1206" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#52667d" font-weight="600" text-anchor="start">vd: 2388 từ đầu module</text>
<line x1="64" y1="1220" x2="1536" y2="1220" stroke="#e3eaf2" stroke-width="1"/>
<rect x="64" y="1228" width="14" height="28" rx="3" fill="#11756e" stroke="none" stroke-width="2"/>
<text x="92" y="1250" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#11756e" font-weight="700" text-anchor="start">Physical · Absolute</text>
<text x="430" y="1250" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#182f48" font-weight="400" text-anchor="start">vị trí thực trong bộ nhớ chính</text>
<text x="1060" y="1250" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#52667d" font-weight="600" text-anchor="start">vd: 22388</text>
<text x="48" y="1304" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#52667d" font-weight="400" text-anchor="start">Ví dụ số theo C7 s16; bố cục RAM chỉ minh họa. Chương trình chỉ cầm địa chỉ logical — dời tiến trình thì đổi địa chỉ nạp, không sửa chương trình.</text>
</svg>
