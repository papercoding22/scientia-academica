<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="876" viewBox="0 0 1600 876" font-family="Arial, Helvetica, sans-serif" role="img"><title>Mind map — Các kiểu địa chỉ nhớ</title><rect x="0" y="0" width="1600" height="876" fill="#ffffff" /><text x="40" y="52" font-size="30" fill="#0f172a" text-anchor="start" font-weight="700"><tspan x="40" dy="0">Mind map — Các kiểu địa chỉ nhớ</tspan></text><text x="40" y="86" font-size="18" fill="#475569" text-anchor="start" font-weight="400"><tspan x="40" dy="0">IT007 · L08 mục 2 · nguồn C7 s12–s18</tspan></text><path d="M 655 493.0 C 627.5 493.0 627.5 221.5 600 221.5" fill="none" stroke="#2563eb" stroke-width="3" /><text x="600" y="209.5" font-size="21" fill="#2563eb" text-anchor="end" font-weight="700"><tspan x="600" dy="0">Là gì?</tspan></text><line x1="600" y1="221.5" x2="340" y2="221.5" stroke="#2563eb" stroke-width="2" /><path d="M 340 221.5 Q 340 185.5 310 185.5" fill="none" stroke="#2563eb" stroke-width="2" /><text x="310" y="151.5" font-size="19" fill="#334155" text-anchor="end" font-weight="400"><tspan x="310" dy="0">Cách gọi một vị trí nhớ ở</tspan><tspan x="310" dy="25.650000000000002">từng bước: code → compile</tspan><tspan x="310" dy="25.650000000000002">→ link → load</tspan></text><path d="M 340 221.5 Q 340 271.0 310 271.0" fill="none" stroke="#2563eb" stroke-width="2" /><text x="310" y="250.5" font-size="19" fill="#334155" text-anchor="end" font-weight="400"><tspan x="310" dy="0">Chương trình dùng tên tạm;</tspan><tspan x="310" dy="25.650000000000002">RAM dùng ô thật</tspan></text><path d="M 655 493.0 C 627.5 493.0 627.5 460.5 600 460.5" fill="none" stroke="#9333ea" stroke-width="3" /><text x="600" y="448.5" font-size="21" fill="#9333ea" text-anchor="end" font-weight="700"><tspan x="600" dy="0">Logical (virtual)</tspan></text><line x1="600" y1="460.5" x2="340" y2="460.5" stroke="#9333ea" stroke-width="2" /><path d="M 340 460.5 Q 340 375.0 310 375.0" fill="none" stroke="#9333ea" stroke-width="2" /><text x="310" y="354.5" font-size="19" fill="#334155" text-anchor="end" font-weight="400"><tspan x="310" dy="0">Vị trí diễn tả trong</tspan><tspan x="310" dy="25.650000000000002">chương trình</tspan></text><path d="M 340 460.5 Q 340 447.0 310 447.0" fill="none" stroke="#9333ea" stroke-width="2" /><text x="310" y="426.5" font-size="19" fill="#334155" text-anchor="end" font-weight="400"><tspan x="310" dy="0">Compiler sinh mọi tham</tspan><tspan x="310" dy="25.650000000000002">chiếu dạng logical</tspan></text><path d="M 340 460.5 Q 340 532.5 310 532.5" fill="none" stroke="#9333ea" stroke-width="2" /><text x="310" y="498.5" font-size="19" fill="#334155" text-anchor="end" font-weight="400"><tspan x="310" dy="0">Relative: logical tính từ</tspan><tspan x="310" dy="25.650000000000002">mốc (vd 2388 từ đầu</tspan><tspan x="310" dy="25.650000000000002">module)</tspan></text><path d="M 655 493.0 C 627.5 493.0 627.5 722.0 600 722.0" fill="none" stroke="#be123c" stroke-width="3" /><text x="600" y="710.0" font-size="21" fill="#be123c" text-anchor="end" font-weight="700"><tspan x="600" dy="0">Vì sao tách hai loại?</tspan></text><line x1="600" y1="722.0" x2="340" y2="722.0" stroke="#be123c" stroke-width="2" /><path d="M 340 722.0 Q 340 650.0 310 650.0" fill="none" stroke="#be123c" stroke-width="2" /><text x="310" y="629.5" font-size="19" fill="#334155" text-anchor="end" font-weight="400"><tspan x="310" dy="0">Lúc compile chưa biết chỗ</tspan><tspan x="310" dy="25.650000000000002">nạp</tspan></text><path d="M 340 722.0 Q 340 722.0 310 722.0" fill="none" stroke="#be123c" stroke-width="2" /><text x="310" y="701.5" font-size="19" fill="#334155" text-anchor="end" font-weight="400"><tspan x="310" dy="0">Nhiều module biên dịch</tspan><tspan x="310" dy="25.650000000000002">riêng</tspan></text><path d="M 340 722.0 Q 340 794.0 310 794.0" fill="none" stroke="#be123c" stroke-width="2" /><text x="310" y="773.5" font-size="19" fill="#334155" text-anchor="end" font-weight="400"><tspan x="310" dy="0">Dời tiến trình không phải</tspan><tspan x="310" dy="25.650000000000002">sửa chương trình</tspan></text><path d="M 945 493.0 C 972.5 493.0 972.5 259.0 1000 259.0" fill="none" stroke="#0f766e" stroke-width="3" /><text x="1000" y="247.0" font-size="21" fill="#0f766e" text-anchor="start" font-weight="700"><tspan x="1000" dy="0">Symbolic</tspan></text><line x1="1000" y1="259.0" x2="1260" y2="259.0" stroke="#0f766e" stroke-width="2" /><path d="M 1260 259.0 Q 1260 235.0 1290 235.0" fill="none" stroke="#0f766e" stroke-width="2" /><text x="1290" y="214.5" font-size="19" fill="#334155" text-anchor="start" font-weight="400"><tspan x="1290" dy="0">Tên trong source: biến,</tspan><tspan x="1290" dy="25.650000000000002">hàm, pointer</tspan></text><path d="M 1260 259.0 Q 1260 295.0 1290 295.0" fill="none" stroke="#0f766e" stroke-width="2" /><text x="1290" y="288.0" font-size="19" fill="#334155" text-anchor="start" font-weight="400"><tspan x="1290" dy="0">vd: int i; add(a, b)</tspan></text><path d="M 945 493.0 C 972.5 493.0 972.5 447.0 1000 447.0" fill="none" stroke="#b45309" stroke-width="3" /><text x="1000" y="435.0" font-size="21" fill="#b45309" text-anchor="start" font-weight="700"><tspan x="1000" dy="0">Physical</tspan></text><line x1="1000" y1="447.0" x2="1260" y2="447.0" stroke="#b45309" stroke-width="2" /><path d="M 1260 447.0 Q 1260 387.0 1290 387.0" fill="none" stroke="#b45309" stroke-width="2" /><text x="1290" y="366.5" font-size="19" fill="#334155" text-anchor="start" font-weight="400"><tspan x="1290" dy="0">Vị trí thực trong bộ nhớ</tspan><tspan x="1290" dy="25.650000000000002">chính</tspan></text><path d="M 1260 447.0 Q 1260 447.0 1290 447.0" fill="none" stroke="#b45309" stroke-width="2" /><text x="1290" y="440.0" font-size="19" fill="#334155" text-anchor="start" font-weight="400"><tspan x="1290" dy="0">Absolute ≈ physical</tspan></text><path d="M 1260 447.0 Q 1260 507.0 1290 507.0" fill="none" stroke="#b45309" stroke-width="2" /><text x="1290" y="486.5" font-size="19" fill="#334155" text-anchor="start" font-weight="400"><tspan x="1290" dy="0">vd sau load tại 20000:</tspan><tspan x="1290" dy="25.650000000000002">22388</tspan></text><path d="M 945 493.0 C 972.5 493.0 972.5 671.0 1000 671.0" fill="none" stroke="#475569" stroke-width="3" /><text x="1000" y="659.0" font-size="21" fill="#475569" text-anchor="start" font-weight="700"><tspan x="1000" dy="0">Đổi logical → physical</tspan></text><line x1="1000" y1="671.0" x2="1260" y2="671.0" stroke="#475569" stroke-width="2" /><path d="M 1260 671.0 Q 1260 611.0 1290 611.0" fill="none" stroke="#475569" stroke-width="2" /><text x="1290" y="590.5" font-size="19" fill="#334155" text-anchor="start" font-weight="400"><tspan x="1290" dy="0">MMU: physical = logical +</tspan><tspan x="1290" dy="25.650000000000002">relocation register</tspan></text><path d="M 1260 671.0 Q 1260 671.0 1290 671.0" fill="none" stroke="#475569" stroke-width="2" /><text x="1290" y="664.0" font-size="19" fill="#334155" text-anchor="start" font-weight="400"><tspan x="1290" dy="0">vd 346 + 14000 = 14346</tspan></text><path d="M 1260 671.0 Q 1260 731.0 1290 731.0" fill="none" stroke="#475569" stroke-width="2" /><text x="1290" y="710.5" font-size="19" fill="#334155" text-anchor="start" font-weight="400"><tspan x="1290" dy="0">Đổi lúc nào → address</tspan><tspan x="1290" dy="25.650000000000002">binding (mục 3)</tspan></text><rect x="655" y="445.0" width="290" height="96" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3" /><text x="800" y="485.0" font-size="24" fill="#0f172a" text-anchor="middle" font-weight="700"><tspan x="800" dy="0">Các kiểu</tspan><tspan x="800" dy="32.400000000000006">address</tspan></text></svg>