<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="855" viewBox="0 0 1600 855" font-family="Arial, Helvetica, sans-serif" role="img"><title>Mind map — Address binding (chuyển đổi địa chỉ)</title><rect x="0" y="0" width="1600" height="855" fill="#ffffff" /><text x="40" y="52" font-size="30" fill="#0f172a" text-anchor="start" font-weight="700"><tspan x="40" dy="0">Mind map — Address binding (chuyển đổi địa chỉ)</tspan></text><text x="40" y="86" font-size="18" fill="#475569" text-anchor="start" font-weight="400"><tspan x="40" dy="0">IT007 · L08 mục 3 · nguồn C7 s18–s22</tspan></text><path d="M 655 482.5 C 627.5 482.5 627.5 235.0 600 235.0" fill="none" stroke="#2563eb" stroke-width="3" /><text x="600" y="223.0" font-size="21" fill="#2563eb" text-anchor="end" font-weight="700"><tspan x="600" dy="0">Là gì?</tspan></text><line x1="600" y1="235.0" x2="340" y2="235.0" stroke="#2563eb" stroke-width="2" /><path d="M 340 235.0 Q 340 185.5 310 185.5" fill="none" stroke="#2563eb" stroke-width="2" /><text x="310" y="151.5" font-size="19" fill="#334155" text-anchor="end" font-weight="400"><tspan x="310" dy="0">Ánh xạ địa chỉ từ không</tspan><tspan x="310" dy="25.650000000000002">gian này sang không gian</tspan><tspan x="310" dy="25.650000000000002">khác</tspan></text><path d="M 340 235.0 Q 340 284.5 310 284.5" fill="none" stroke="#2563eb" stroke-width="2" /><text x="310" y="250.5" font-size="19" fill="#334155" text-anchor="end" font-weight="400"><tspan x="310" dy="0">Câu hỏi cốt lõi: đổi</tspan><tspan x="310" dy="25.650000000000002">logical → physical vào lúc</tspan><tspan x="310" dy="25.650000000000002">nào?</tspan></text><path d="M 655 482.5 C 627.5 482.5 627.5 462.0 600 462.0" fill="none" stroke="#9333ea" stroke-width="3" /><text x="600" y="450.0" font-size="21" fill="#9333ea" text-anchor="end" font-weight="700"><tspan x="600" dy="0">Qua từng giai đoạn</tspan></text><line x1="600" y1="462.0" x2="340" y2="462.0" stroke="#9333ea" stroke-width="2" /><path d="M 340 462.0 Q 340 390.0 310 390.0" fill="none" stroke="#9333ea" stroke-width="2" /><text x="310" y="383.0" font-size="19" fill="#334155" text-anchor="end" font-weight="400"><tspan x="310" dy="0">Source: symbolic</tspan></text><path d="M 340 462.0 Q 340 450.0 310 450.0" fill="none" stroke="#9333ea" stroke-width="2" /><text x="310" y="429.5" font-size="19" fill="#334155" text-anchor="end" font-weight="400"><tspan x="310" dy="0">Compile: thường</tspan><tspan x="310" dy="25.650000000000002">relocatable</tspan></text><path d="M 340 462.0 Q 340 522.0 310 522.0" fill="none" stroke="#9333ea" stroke-width="2" /><text x="310" y="501.5" font-size="19" fill="#334155" text-anchor="end" font-weight="400"><tspan x="310" dy="0">Link/load: có thể là địa</tspan><tspan x="310" dy="25.650000000000002">chỉ thực</tspan></text><path d="M 655 482.5 C 627.5 482.5 627.5 699.5 600 699.5" fill="none" stroke="#be123c" stroke-width="3" /><text x="600" y="687.5" font-size="21" fill="#be123c" text-anchor="end" font-weight="700"><tspan x="600" dy="0">Đánh đổi &amp; dễ nhầm</tspan></text><line x1="600" y1="699.5" x2="340" y2="699.5" stroke="#be123c" stroke-width="2" /><path d="M 340 699.5 Q 340 639.5 310 639.5" fill="none" stroke="#be123c" stroke-width="2" /><text x="310" y="605.5" font-size="19" fill="#334155" text-anchor="end" font-weight="400"><tspan x="310" dy="0">Ba thời điểm là lựa chọn,</tspan><tspan x="310" dy="25.650000000000002">không phải ba bước nối</tspan><tspan x="310" dy="25.650000000000002">tiếp</tspan></text><path d="M 340 699.5 Q 340 713.0 310 713.0" fill="none" stroke="#be123c" stroke-width="2" /><text x="310" y="706.0" font-size="19" fill="#334155" text-anchor="end" font-weight="400"><tspan x="310" dy="0">Càng muộn càng linh hoạt</tspan></text><path d="M 340 699.5 Q 340 773.0 310 773.0" fill="none" stroke="#be123c" stroke-width="2" /><text x="310" y="752.5" font-size="19" fill="#334155" text-anchor="end" font-weight="400"><tspan x="310" dy="0">Đừng lẫn: dịch lại</tspan><tspan x="310" dy="25.650000000000002">(compile) ≠ nạp lại (load)</tspan></text><path d="M 945 482.5 C 972.5 482.5 972.5 248.5 1000 248.5" fill="none" stroke="#0f766e" stroke-width="3" /><text x="1000" y="236.5" font-size="21" fill="#0f766e" text-anchor="start" font-weight="700"><tspan x="1000" dy="0">Compile time</tspan></text><line x1="1000" y1="248.5" x2="1260" y2="248.5" stroke="#0f766e" stroke-width="2" /><path d="M 1260 248.5 Q 1260 188.5 1290 188.5" fill="none" stroke="#0f766e" stroke-width="2" /><text x="1290" y="168.0" font-size="19" fill="#334155" text-anchor="start" font-weight="400"><tspan x="1290" dy="0">Biết trước chỗ nạp → sinh</tspan><tspan x="1290" dy="25.650000000000002">địa chỉ tuyệt đối</tspan></text><path d="M 1260 248.5 Q 1260 248.5 1290 248.5" fill="none" stroke="#0f766e" stroke-width="2" /><text x="1290" y="241.5" font-size="19" fill="#334155" text-anchor="start" font-weight="400"><tspan x="1290" dy="0">vd .COM (MS-DOS)</tspan></text><path d="M 1260 248.5 Q 1260 308.5 1290 308.5" fill="none" stroke="#0f766e" stroke-width="2" /><text x="1290" y="288.0" font-size="19" fill="#334155" text-anchor="start" font-weight="400"><tspan x="1290" dy="0">Đổi chỗ nạp → phải biên</tspan><tspan x="1290" dy="25.650000000000002">dịch lại</tspan></text><path d="M 945 482.5 C 972.5 482.5 972.5 472.5 1000 472.5" fill="none" stroke="#b45309" stroke-width="3" /><text x="1000" y="460.5" font-size="21" fill="#b45309" text-anchor="start" font-weight="700"><tspan x="1000" dy="0">Load time</tspan></text><line x1="1000" y1="472.5" x2="1260" y2="472.5" stroke="#b45309" stroke-width="2" /><path d="M 1260 472.5 Q 1260 412.5 1290 412.5" fill="none" stroke="#b45309" stroke-width="2" /><text x="1290" y="392.0" font-size="19" fill="#334155" text-anchor="start" font-weight="400"><tspan x="1290" dy="0">Loader cộng địa chỉ nền</tspan><tspan x="1290" dy="25.650000000000002">vào địa chỉ relocatable</tspan></text><path d="M 1260 472.5 Q 1260 472.5 1290 472.5" fill="none" stroke="#b45309" stroke-width="2" /><text x="1290" y="465.5" font-size="19" fill="#334155" text-anchor="start" font-weight="400"><tspan x="1290" dy="0">1024 + 400 = 1424</tspan></text><path d="M 1260 472.5 Q 1260 532.5 1290 532.5" fill="none" stroke="#b45309" stroke-width="2" /><text x="1290" y="512.0" font-size="19" fill="#334155" text-anchor="start" font-weight="400"><tspan x="1290" dy="0">Đổi địa chỉ nền → phải nạp</tspan><tspan x="1290" dy="25.650000000000002">lại</tspan></text><path d="M 945 482.5 C 972.5 482.5 972.5 696.5 1000 696.5" fill="none" stroke="#475569" stroke-width="3" /><text x="1000" y="684.5" font-size="21" fill="#475569" text-anchor="start" font-weight="700"><tspan x="1000" dy="0">Execution time</tspan></text><line x1="1000" y1="696.5" x2="1260" y2="696.5" stroke="#475569" stroke-width="2" /><path d="M 1260 696.5 Q 1260 636.5 1290 636.5" fill="none" stroke="#475569" stroke-width="2" /><text x="1290" y="616.0" font-size="19" fill="#334155" text-anchor="start" font-weight="400"><tspan x="1290" dy="0">Tiến trình có thể bị dời</tspan><tspan x="1290" dy="25.650000000000002">khi đang chạy</tspan></text><path d="M 1260 696.5 Q 1260 696.5 1290 696.5" fill="none" stroke="#475569" stroke-width="2" /><text x="1290" y="689.5" font-size="19" fill="#334155" text-anchor="start" font-weight="400"><tspan x="1290" dy="0">Cần phần cứng ánh xạ</tspan></text><path d="M 1260 696.5 Q 1260 756.5 1290 756.5" fill="none" stroke="#475569" stroke-width="2" /><text x="1290" y="736.0" font-size="19" fill="#334155" text-anchor="start" font-weight="400"><tspan x="1290" dy="0">Dùng trong đa số OS đa</tspan><tspan x="1290" dy="25.650000000000002">dụng</tspan></text><rect x="655" y="434.5" width="290" height="96" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3" /><text x="800" y="474.5" font-size="24" fill="#0f172a" text-anchor="middle" font-weight="700"><tspan x="800" dy="0">Address</tspan><tspan x="800" dy="32.400000000000006">binding</tspan></text></svg>