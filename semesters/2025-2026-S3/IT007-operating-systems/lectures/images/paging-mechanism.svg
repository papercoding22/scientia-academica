<text x="48" y="1304" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#667f90" font-weight="400" text-anchor="start">Các page đã ở RAM, ánh xạ hợp lệ; bỏ qua TLB, page fault và chi tiết bit bảo vệ. Chỉ vẽ các page/frame liên quan.</text>
<text x="48" y="1336" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#667f90" font-weight="400" text-anchor="start">AI dựng theo IT007 · C7 s41, s44–s47 · Số liệu theo s46; địa chỉ thập phân và bố cục được bổ sung để dễ theo dõi.</text>
