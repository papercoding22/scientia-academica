<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1350" viewBox="0 0 1760 1350" role="img" aria-labelledby="title desc">
<title id="title">Paging: các page nằm rải rác, CPU vẫn tìm đúng byte</title>
<desc id="desc">Page và frame đều 1024 byte. Page table của process P ánh xạ page 0 sang frame 5, page 1 sang frame 6, page 2 sang frame 25. CPU truy cập địa chỉ luận lý 1502: p bằng 1, offset d bằng 478. Tra entry 1 lấy frame 6; giữ nguyên offset, tạo địa chỉ vật lý 6 nhân 1024 cộng 478 bằng 6622. Mũi tên nét đứt chỉ ánh xạ; nét liền chỉ luồng xử lý địa chỉ, không phải di chuyển page.</desc>
<rect x="0" y="0" width="1760" height="1350" rx="0" fill="#fbfcfd" stroke="none" stroke-width="2"/>
<text x="48" y="62" font-family="Arial, Helvetica, sans-serif" font-size="38" fill="#233b4f" font-weight="700" text-anchor="start">PAGING — PAGE RẢI RÁC, CPU VẪN TÌM ĐÚNG BYTE</text>
<text x="48" y="106" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#536d80" font-weight="400" text-anchor="start">Page (trang) và frame (khung) cùng cỡ: 1 KiB = 1024 byte</text>
<path d="M48 139H1712" fill="none" stroke="#d7e1e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="48" y="190" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#233b4f" font-weight="700" text-anchor="start">01 · OS đã nạp các page và thiết lập ánh xạ cho process P</text>
<text x="80" y="250" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#233b4f" font-weight="700" text-anchor="start">Không gian luận lý của P</text>
<text x="660" y="250" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#233b4f" font-weight="700" text-anchor="start">Page table của P</text>
<text x="1290" y="250" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#233b4f" font-weight="700" text-anchor="start">RAM · trích các frame</text>
<text x="80" y="284" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#667f90" font-weight="400" text-anchor="start">Trích page 0, 1, 2 liên tiếp</text>
<text x="660" y="284" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#667f90" font-weight="400" text-anchor="start">Trích 3 entry · bảng nằm trong RAM</text>
