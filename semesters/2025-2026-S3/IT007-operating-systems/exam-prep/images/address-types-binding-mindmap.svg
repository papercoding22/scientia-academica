<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="876" viewBox="0 0 1600 876" font-family="Arial, Helvetica, sans-serif" role="img"><title>2.1 · CÁC KIỂU ĐỊA CHỈ &amp; ADDRESS BINDING</title><rect x="0" y="0" width="1600" height="876" fill="#ffffff" /><text x="40" y="52" font-size="30" fill="#0f172a" text-anchor="start" font-weight="700"><tspan x="40" dy="0">2.1 · CÁC KIỂU ĐỊA CHỈ &amp; ADDRESS BINDING</tspan></text><text x="40" y="86" font-size="18" fill="#475569" text-anchor="start" font-weight="400"><tspan x="40" dy="0">IT007 · C7 s12, s18–s22 · Câu 15, 16, 23c: đáp án suy luận từ slide; đề mẫu không có đáp án chính thức.</tspan></text><path d="M 655 493.0 C 627.5 493.0 627.5 172.0 600 172.0" fill="none" stroke="#2563eb" stroke-width="3" /><text x="600" y="160.0" font-size="21" fill="#2563eb" text-anchor="end" font-weight="700"><tspan x="600" dy="0">Binding là gì?</tspan></text><line x1="600" y1="172.0" x2="340" y2="172.0" stroke="#2563eb" stroke-width="2" /><path d="M 340 172.0 Q 340 172.0 310 172.0" fill="none" stroke="#2563eb" stroke-width="2" /><text x="310" y="151.5" font-size="19" fill="#334155" text-anchor="end" font-weight="400"><tspan x="310" dy="0">Ánh xạ giữa các</tspan><tspan x="310" dy="25.650000000000002">không gian địa chỉ</tspan></text><path d="M 655 493.0 C 627.5 493.0 627.5 433.5 600 433.5" fill="none" stroke="#9333ea" stroke-width="3" /><text x="600" y="421.5" font-size="21" fill="#9333ea" text-anchor="end" font-weight="700"><tspan x="600" dy="0">Các kiểu địa chỉ</tspan></text><line x1="600" y1="433.5" x2="340" y2="433.5" stroke="#9333ea" stroke-width="2" /><path d="M 340 433.5 Q 340 276.0 310 276.0" fill="none" stroke="#9333ea" stroke-width="2" /><text x="310" y="255.5" font-size="19" fill="#334155" text-anchor="end" font-weight="400"><tspan x="310" dy="0">Symbolic: tên trong source</tspan><tspan x="310" dy="25.650000000000002">C15 → Symbolic address</tspan></text><path d="M 340 433.5 Q 340 361.5 310 361.5" fill="none" stroke="#9333ea" stroke-width="2" /><text x="310" y="327.5" font-size="19" fill="#334155" text-anchor="end" font-weight="400"><tspan x="310" dy="0">Logical (virtual): vị trí</tspan><tspan x="310" dy="25.650000000000002">trong chương trình</tspan><tspan x="310" dy="25.650000000000002">C23c → Logical address</tspan></text><path d="M 340 433.5 Q 340 447.0 310 447.0" fill="none" stroke="#9333ea" stroke-width="2" /><text x="310" y="426.5" font-size="19" fill="#334155" text-anchor="end" font-weight="400"><tspan x="310" dy="0">Relocatable (relative):</tspan><tspan x="310" dy="25.650000000000002">tương đối so với một mốc</tspan></text><path d="M 340 433.5 Q 340 519.0 310 519.0" fill="none" stroke="#9333ea" stroke-width="2" /><text x="310" y="498.5" font-size="19" fill="#334155" text-anchor="end" font-weight="400"><tspan x="310" dy="0">Physical: vị trí thực</tspan><tspan x="310" dy="25.650000000000002">trong RAM</tspan></text><path d="M 340 433.5 Q 340 591.0 310 591.0" fill="none" stroke="#9333ea" stroke-width="2" /><text x="310" y="570.5" font-size="19" fill="#334155" text-anchor="end" font-weight="400"><tspan x="310" dy="0">Absolute: tương đương</tspan><tspan x="310" dy="25.650000000000002">physical trong slide</tspan></text><path d="M 655 493.0 C 627.5 493.0 627.5 744.5 600 744.5" fill="none" stroke="#be123c" stroke-width="3" /><text x="600" y="732.5" font-size="21" fill="#be123c" text-anchor="end" font-weight="700"><tspan x="600" dy="0">Điểm cần nhớ</tspan></text><line x1="600" y1="744.5" x2="340" y2="744.5" stroke="#be123c" stroke-width="2" /><path d="M 340 744.5 Q 340 695.0 310 695.0" fill="none" stroke="#be123c" stroke-width="2" /><text x="310" y="674.5" font-size="19" fill="#334155" text-anchor="end" font-weight="400"><tspan x="310" dy="0">Symbolic và logical</tspan><tspan x="310" dy="25.650000000000002">không dùng thay tùy ý</tspan></text><path d="M 340 744.5 Q 340 780.5 310 780.5" fill="none" stroke="#be123c" stroke-width="2" /><text x="310" y="746.5" font-size="19" fill="#334155" text-anchor="end" font-weight="400"><tspan x="310" dy="0">Ba lựa chọn binding,</tspan><tspan x="310" dy="25.650000000000002">không phải ba bước</tspan><tspan x="310" dy="25.650000000000002">bắt buộc nối tiếp</tspan></text><path d="M 945 493.0 C 972.5 493.0 972.5 319.0 1000 319.0" fill="none" stroke="#0f766e" stroke-width="3" /><text x="1000" y="307.0" font-size="21" fill="#0f766e" text-anchor="start" font-weight="700"><tspan x="1000" dy="0">Compile time</tspan></text><line x1="1000" y1="319.0" x2="1260" y2="319.0" stroke="#0f766e" stroke-width="2" /><path d="M 1260 319.0 Q 1260 283.0 1290 283.0" fill="none" stroke="#0f766e" stroke-width="2" /><text x="1290" y="262.5" font-size="19" fill="#334155" text-anchor="start" font-weight="400"><tspan x="1290" dy="0">Biết trước nơi nạp;</tspan><tspan x="1290" dy="25.650000000000002">gán địa chỉ tuyệt đối</tspan></text><path d="M 1260 319.0 Q 1260 355.0 1290 355.0" fill="none" stroke="#0f766e" stroke-width="2" /><text x="1290" y="334.5" font-size="19" fill="#334155" text-anchor="start" font-weight="400"><tspan x="1290" dy="0">Đổi nơi nạp → biên dịch</tspan><tspan x="1290" dy="25.650000000000002">lại (câu 16)</tspan></text><path d="M 945 493.0 C 972.5 493.0 972.5 483.0 1000 483.0" fill="none" stroke="#b45309" stroke-width="3" /><text x="1000" y="471.0" font-size="21" fill="#b45309" text-anchor="start" font-weight="700"><tspan x="1000" dy="0">Load time</tspan></text><line x1="1000" y1="483.0" x2="1260" y2="483.0" stroke="#b45309" stroke-width="2" /><path d="M 1260 483.0 Q 1260 459.0 1290 459.0" fill="none" stroke="#b45309" stroke-width="2" /><text x="1290" y="438.5" font-size="19" fill="#334155" text-anchor="start" font-weight="400"><tspan x="1290" dy="0">Loader gán địa chỉ thực</tspan><tspan x="1290" dy="25.650000000000002">theo địa chỉ nền</tspan></text><path d="M 1260 483.0 Q 1260 519.0 1290 519.0" fill="none" stroke="#b45309" stroke-width="2" /><text x="1290" y="512.0" font-size="19" fill="#334155" text-anchor="start" font-weight="400"><tspan x="1290" dy="0">Đổi nền → reload</tspan></text><path d="M 945 493.0 C 972.5 493.0 972.5 647.0 1000 647.0" fill="none" stroke="#475569" stroke-width="3" /><text x="1000" y="635.0" font-size="21" fill="#475569" text-anchor="start" font-weight="700"><tspan x="1000" dy="0">Execution time</tspan></text><line x1="1000" y1="647.0" x2="1260" y2="647.0" stroke="#475569" stroke-width="2" /><path d="M 1260 647.0 Q 1260 611.0 1290 611.0" fill="none" stroke="#475569" stroke-width="2" /><text x="1290" y="590.5" font-size="19" fill="#334155" text-anchor="start" font-weight="400"><tspan x="1290" dy="0">Dịch khi chạy;</tspan><tspan x="1290" dy="25.650000000000002">cần phần cứng hỗ trợ</tspan></text><path d="M 1260 647.0 Q 1260 683.0 1290 683.0" fill="none" stroke="#475569" stroke-width="2" /><text x="1290" y="662.5" font-size="19" fill="#334155" text-anchor="start" font-weight="400"><tspan x="1290" dy="0">Có thể đổi ánh xạ</tspan><tspan x="1290" dy="25.650000000000002">khi dời process</tspan></text><rect x="655" y="445.0" width="290" height="96" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3" /><text x="800" y="485.0" font-size="24" fill="#0f172a" text-anchor="middle" font-weight="700"><tspan x="800" dy="0">Địa chỉ &amp;</tspan><tspan x="800" dy="32.400000000000006">address binding</tspan></text></svg>