<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="649" viewBox="0 0 1600 649" font-family="Arial, Helvetica, sans-serif" role="img"><title>2.2 · DYNAMIC LOADING &amp; DYNAMIC LINKING</title><rect x="0" y="0" width="1600" height="649" fill="#ffffff" /><text x="40" y="52" font-size="30" fill="#0f172a" text-anchor="start" font-weight="700"><tspan x="40" dy="0">2.2 · DYNAMIC LOADING &amp; DYNAMIC LINKING</tspan></text><text x="40" y="86" font-size="18" fill="#475569" text-anchor="start" font-weight="400"><tspan x="40" dy="0">IT007 · C7 s24–s25, s27 · Câu 18: đáp án suy luận từ slide; đề mẫu không có đáp án chính thức.</tspan></text><path d="M 655 379.5 C 627.5 379.5 627.5 281.5 600 281.5" fill="none" stroke="#2563eb" stroke-width="3" /><text x="600" y="269.5" font-size="21" fill="#2563eb" text-anchor="end" font-weight="700"><tspan x="600" dy="0">Dynamic loading</tspan></text><line x1="600" y1="281.5" x2="340" y2="281.5" stroke="#2563eb" stroke-width="2" /><path d="M 340 281.5 Q 340 209.5 310 209.5" fill="none" stroke="#2563eb" stroke-width="2" /><text x="310" y="189.0" font-size="19" fill="#334155" text-anchor="end" font-weight="400"><tspan x="310" dy="0">Chỉ nạp routine khi được</tspan><tspan x="310" dy="25.650000000000002">gọi</tspan></text><path d="M 340 281.5 Q 340 281.5 310 281.5" fill="none" stroke="#2563eb" stroke-width="2" /><text x="310" y="261.0" font-size="19" fill="#334155" text-anchor="end" font-weight="400"><tspan x="310" dy="0">Mã chưa dùng không chiếm</tspan><tspan x="310" dy="25.650000000000002">RAM</tspan></text><path d="M 340 281.5 Q 340 353.5 310 353.5" fill="none" stroke="#2563eb" stroke-width="2" /><text x="310" y="333.0" font-size="19" fill="#334155" text-anchor="end" font-weight="400"><tspan x="310" dy="0">Hữu ích với mã ít dùng,</tspan><tspan x="310" dy="25.650000000000002">như xử lý lỗi</tspan></text><path d="M 655 379.5 C 627.5 379.5 627.5 493.5 600 493.5" fill="none" stroke="#9333ea" stroke-width="3" /><text x="600" y="481.5" font-size="21" fill="#9333ea" text-anchor="end" font-weight="700"><tspan x="600" dy="0">Câu 18</tspan></text><line x1="600" y1="493.5" x2="340" y2="493.5" stroke="#9333ea" stroke-width="2" /><path d="M 340 493.5 Q 340 457.5 310 457.5" fill="none" stroke="#9333ea" stroke-width="2" /><text x="310" y="437.0" font-size="19" fill="#334155" text-anchor="end" font-weight="400"><tspan x="310" dy="0">Dấu hiệu: “chỉ nạp khi</tspan><tspan x="310" dy="25.650000000000002">được gọi”</tspan></text><path d="M 340 493.5 Q 340 529.5 310 529.5" fill="none" stroke="#9333ea" stroke-width="2" /><text x="310" y="509.0" font-size="19" fill="#334155" text-anchor="end" font-weight="400"><tspan x="310" dy="0">B — Dynamic loading (đáp</tspan><tspan x="310" dy="25.650000000000002">án suy luận)</tspan></text><path d="M 945 379.5 C 972.5 379.5 972.5 257.5 1000 257.5" fill="none" stroke="#0f766e" stroke-width="3" /><text x="1000" y="245.5" font-size="21" fill="#0f766e" text-anchor="start" font-weight="700"><tspan x="1000" dy="0">Dynamic linking</tspan></text><line x1="1000" y1="257.5" x2="1260" y2="257.5" stroke="#0f766e" stroke-width="2" /><path d="M 1260 257.5 Q 1260 172.0 1290 172.0" fill="none" stroke="#0f766e" stroke-width="2" /><text x="1290" y="151.5" font-size="19" fill="#334155" text-anchor="start" font-weight="400"><tspan x="1290" dy="0">Liên kết tới module ngoài</tspan><tspan x="1290" dy="25.650000000000002">sau khi tạo executable</tspan></text><path d="M 1260 257.5 Q 1260 257.5 1290 257.5" fill="none" stroke="#0f766e" stroke-width="2" /><text x="1290" y="223.5" font-size="19" fill="#334155" text-anchor="start" font-weight="400"><tspan x="1290" dy="0">Stub tìm/nạp routine khi</tspan><tspan x="1290" dy="25.650000000000002">gọi lần đầu (mô hình</tspan><tspan x="1290" dy="25.650000000000002">slide)</tspan></text><path d="M 1260 257.5 Q 1260 343.0 1290 343.0" fill="none" stroke="#0f766e" stroke-width="2" /><text x="1290" y="322.5" font-size="19" fill="#334155" text-anchor="start" font-weight="400"><tspan x="1290" dy="0">Cần OS hỗ trợ; có thể chia</tspan><tspan x="1290" dy="25.650000000000002">sẻ mã thư viện</tspan></text><path d="M 945 379.5 C 972.5 379.5 972.5 507.0 1000 507.0" fill="none" stroke="#b45309" stroke-width="3" /><text x="1000" y="495.0" font-size="21" fill="#b45309" text-anchor="start" font-weight="700"><tspan x="1000" dy="0">Điểm phân biệt</tspan></text><line x1="1000" y1="507.0" x2="1260" y2="507.0" stroke="#b45309" stroke-width="2" /><path d="M 1260 507.0 Q 1260 435.0 1290 435.0" fill="none" stroke="#b45309" stroke-width="2" /><text x="1290" y="428.0" font-size="19" fill="#334155" text-anchor="start" font-weight="400"><tspan x="1290" dy="0">Loading: đưa mã vào RAM</tspan></text><path d="M 1260 507.0 Q 1260 495.0 1290 495.0" fill="none" stroke="#b45309" stroke-width="2" /><text x="1290" y="474.5" font-size="19" fill="#334155" text-anchor="start" font-weight="400"><tspan x="1290" dy="0">Linking: nối tham chiếu</tspan><tspan x="1290" dy="25.650000000000002">tới mã ngoài</tspan></text><path d="M 1260 507.0 Q 1260 567.0 1290 567.0" fill="none" stroke="#b45309" stroke-width="2" /><text x="1290" y="546.5" font-size="19" fill="#334155" text-anchor="start" font-weight="400"><tspan x="1290" dy="0">Dynamic linking có thể kèm</tspan><tspan x="1290" dy="25.650000000000002">loading</tspan></text><rect x="655" y="331.5" width="290" height="96" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3" /><text x="800" y="371.5" font-size="24" fill="#0f172a" text-anchor="middle" font-weight="700"><tspan x="800" dy="0">Dynamic loading</tspan><tspan x="800" dy="32.400000000000006">&amp; dynamic linking</tspan></text></svg>