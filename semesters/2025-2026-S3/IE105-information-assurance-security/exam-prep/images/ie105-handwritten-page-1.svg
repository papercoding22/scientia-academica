<text x="145" y="132" font-family="Marker Felt, Noteworthy, cursive" font-size="44" fill="#315d83">IE105 · GHI CHÚ ÔN THI</text>
<text x="145" y="224" font-family="Marker Felt, Noteworthy, cursive" font-size="62" fill="#193f63">MẬT MÃ · CÁC GIẢI THUẬT</text>
<text x="145" y="294" font-family="Noteworthy, Bradley Hand, cursive" font-size="38" fill="#52697e">Mặt 1/4 · Mẫu 4 mặt để in hai mặt trên 2 tờ A4</text>
<path d="M145 320 H2335" stroke="#829fb9" stroke-width="4"/>
<path d="M1240 340 V3340" stroke="#d3dfe8" stroke-width="3"/>
<text x="145" y="390" font-family="Marker Felt, Noteworthy, cursive" font-size="46" fill="#a04642">NGUYÊN TẮC &amp; PHÂN LOẠI</text>
<text x="149" y="456" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Thuật toán công khai; độ an toàn nằm ở khóa,</text>
<text x="149" y="512" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  không ở việc giấu thuật toán. [B2A s22]</text>
<text x="149" y="579" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Cổ điển: thay thế ký tự / hoán vị vị trí. Hiện</text>
<text x="149" y="635" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  đại: thiết kế hiện đại hơn.</text>
<text x="149" y="702" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Đối xứng: K_E = K_D (vd AES). Bất đối xứng: K_E</text>
<text x="149" y="758" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  ≠ K_D (vd RSA).</text>
<text x="149" y="825" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Block: khối cố định (DES, 3DES, AES). Stream:</text>
<text x="149" y="881" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  từng bit (RC4). [B2A s10, s20, s42]</text>
<text x="145" y="970" font-family="Marker Felt, Noteworthy, cursive" font-size="46" fill="#a04642">MẬT MÃ CỔ ĐIỂN</text>
<text x="149" y="1036" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Thay thế đơn giản: khóa là hoán vị 26 ký tự</text>
<text x="149" y="1092" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  (26! khóa); yếu vì phân tích tần suất. [B2A</text>
<text x="149" y="1148" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  s23, s39–40]</text>
<text x="149" y="1215" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Hoán vị bậc d: chia bản rõ thành khối d ký tự</text>
<text x="149" y="1271" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  rồi đổi vị trí. [B2A s25]</text>
<text x="149" y="1338" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Caesar / Vigenère: C = (P + K) mod 26. Vigenère</text>
<text x="149" y="1394" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  lặp khóa d ký tự; Caesar là d = 1. [B2A s27]</text>
<text x="149" y="1461" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Affine: E(x) = ax + b mod 26; giải mã x = a⁻¹(y</text>
<text x="149" y="1517" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  − b) mod 26. a = 1 → dịch chuyển. [B2A s30]</text>
<text x="149" y="1584" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Playfair: mã từng cặp; ma trận 5×5 từ khóa; I</text>
<text x="149" y="1640" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  và J chung một ô. [B2A s31–32]</text>
<text x="149" y="1707" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Hill: khóa ma trận vuông H; C = HP mod 26; P =</text>
<text x="149" y="1763" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  H⁻¹C mod 26. [B2A s35]</text>
<text x="1290" y="390" font-family="Marker Felt, Noteworthy, cursive" font-size="46" fill="#a04642">MẬT MÃ HIỆN ĐẠI</text>
<text x="1294" y="456" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• DES: đối xứng, block; khóa 56 bit, khối 64 bit,</text>
<text x="1294" y="512" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  16 vòng / 16 khóa con. Khóa ngắn, dễ vét cạn;</text>
<text x="1294" y="568" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  3DES an toàn hơn. [B2A s43, s46–48]</text>
<text x="1294" y="635" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• AES: đối xứng; khối 128 bit; khóa 128/192/256</text>
<text x="1294" y="691" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  bit. Mỗi vòng: SubBytes → ShiftRows →</text>
<text x="1294" y="747" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  MixColumns → AddRoundKey. [B2A s19, s49–57]</text>
<text x="1294" y="814" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• RSA: bất đối xứng. Public mã hóa → private giải</text>
<text x="1294" y="870" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  mã; private ký → public xác minh. Chậm hơn DES</text>
<text x="1294" y="926" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  nhiều. [B2A s58–64]</text>
<text x="1294" y="993" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Kết hợp: thuật toán đối xứng mã dữ liệu; RSA mã</text>
<text x="1294" y="1049" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  khóa đối xứng. [B2A s64]</text>
<text x="1290" y="1138" font-family="Marker Felt, Noteworthy, cursive" font-size="46" fill="#a04642">PLAYFAIR · CÁCH LÀM</text>
<text x="1294" y="1204" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• 1) Viết khóa, bỏ chữ trùng; điền A–Z còn lại</text>
<text x="1294" y="1260" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  vào ma trận 5×5, gộp I/J.</text>
<text x="1294" y="1327" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• 2) Chia bản rõ thành cặp; nếu tổng ký tự lẻ thì</text>
<text x="1294" y="1383" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  thêm x cuối. [B2A s31–32]</text>
<text x="1294" y="1450" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• 3) Cùng hàng → chữ bên phải; cuối hàng vòng về</text>
<text x="1294" y="1506" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  đầu.</text>
<text x="1294" y="1573" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• 4) Cùng cột → chữ bên dưới; cuối cột vòng về</text>
<text x="1294" y="1629" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  đầu.</text>
<text x="1294" y="1696" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• 5) Hình chữ nhật → mỗi chữ lấy chữ cùng hàng, ở</text>
<text x="1294" y="1752" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  cột của chữ kia.</text>
<text x="1294" y="1819" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Ví dụ slide: khóa PLAYFAIR; THANH PHO HO CHI</text>
<text x="1294" y="1875" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  MINH → TH AN HP HO HO CH IM IN HX → QM PQ EA GQ</text>
<text x="1294" y="1931" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  GQ BK DE EU KW. [B2A s34]</text>
<text x="1290" y="2020" font-family="Marker Felt, Noteworthy, cursive" font-size="46" fill="#a04642">NHỚ NHANH</text>
<text x="1294" y="2086" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• DES: 56 / 64 / 16. AES: block 128, key 128–256.</text>
<text x="1294" y="2142" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  RSA: public / private.</text>
<text x="1294" y="2209" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Đối xứng nhanh, dùng chung bí mật. Bất đối xứng</text>
<text x="1294" y="2265" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  hỗ trợ trao đổi khóa và chữ ký số.</text>
<path d="M145 3370 H2335" stroke="#b7c7d5" stroke-width="3"/>
<text x="145" y="3432" font-family="Noteworthy, Bradley Hand, cursive" font-size="29" fill="#63798e">Nguồn viết tắt: B2A/B2B/B3A/B3B/B4/B5/B6 = slide theo bài; xem exam-map.md.</text>
<text x="2332" y="3432" text-anchor="end" font-family="Noteworthy, Bradley Hand, cursive" font-size="30" fill="#63798e">1/4</text>
