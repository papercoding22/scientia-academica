<text x="145" y="132" font-family="Marker Felt, Noteworthy, cursive" font-size="44" fill="#315d83">IE105 · GHI CHÚ ÔN THI</text>
<text x="145" y="224" font-family="Marker Felt, Noteworthy, cursive" font-size="62" fill="#193f63">WI-FI · PHẠM VI ÔN TẬP</text>
<text x="145" y="294" font-family="Noteworthy, Bradley Hand, cursive" font-size="38" fill="#52697e">Mặt 4/4 · Mẫu 4 mặt để in hai mặt trên 2 tờ A4</text>
<path d="M145 320 H2335" stroke="#829fb9" stroke-width="4"/>
<path d="M1240 340 V3340" stroke="#d3dfe8" stroke-width="3"/>
<text x="145" y="390" font-family="Marker Felt, Noteworthy, cursive" font-size="46" fill="#a04642">WEP · WPA · WPA2</text>
<text x="149" y="456" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• WEP: RC4; IV 24 bit dễ lặp; khóa 40/104 bit</text>
<text x="149" y="512" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  tĩnh; CRC-32; yếu, bỏ dùng.</text>
<text x="149" y="579" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• WPA: RC4 + TKIP; IV 48 bit; khóa 128 bit thay</text>
<text x="149" y="635" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  theo gói; Michael MIC; không còn khuyến nghị.</text>
<text x="149" y="702" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• WPA2: AES-CCMP; IV 48 bit; khóa 128 bit; toàn</text>
<text x="149" y="758" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  vẹn CCMP. [B6 s16, s25–34]</text>
<text x="149" y="825" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• WPA2 Personal = PSK; Enterprise = 802.1X /</text>
<text x="149" y="881" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  RADIUS / EAP.</text>
<text x="149" y="948" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• WPA3: SAE + AES-GCMP; mạnh nhất trong các chuẩn</text>
<text x="149" y="1004" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  được nêu. [B6 s16]</text>
<text x="145" y="1093" font-family="Marker Felt, Noteworthy, cursive" font-size="46" fill="#a04642">CHỨNG THỰC &amp; SSID</text>
<text x="149" y="1159" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Open system · shared key (WEP) · PSK ·</text>
<text x="149" y="1215" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  Enterprise 802.1X/RADIUS/EAP · MAC filtering ·</text>
<text x="149" y="1271" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  captive portal · WPS. [B6 s14–24]</text>
<text x="149" y="1338" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Public → open/captive portal; gia đình → WPA2/3</text>
<text x="149" y="1394" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  Personal; doanh nghiệp → WPA2/3 Enterprise. [B6</text>
<text x="149" y="1450" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  s24]</text>
<text x="149" y="1517" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• SSID: tên mạng, tối đa 32 ký tự, phân biệt hoa</text>
<text x="149" y="1573" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  thường; SSID mặc định có rủi ro. [B6 s11–13]</text>
<text x="145" y="1662" font-family="Marker Felt, Noteworthy, cursive" font-size="46" fill="#a04642">802.11 · ĐÃ XÁC NHẬN</text>
<text x="149" y="1728" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• 802.11a: 54 Mbps / 5 GHz. 802.11b: 11 Mbps /</text>
<text x="149" y="1784" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  2.4 GHz. 802.11ax: 9.6 Gbps. [B6 s9–10]</text>
<text x="149" y="1851" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Chuẩn/tốc độ/năm đầy đủ: đối chiếu slide B6</text>
<text x="149" y="1907" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  s9–10 trước khi chép thêm.</text>
<text x="1290" y="390" font-family="Marker Felt, Noteworthy, cursive" font-size="46" fill="#a04642">NGUY CƠ MẠNG KHÔNG DÂY</text>
<text x="1294" y="456" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Rogue AP · evil twin · honeyspot · MAC spoofing</text>
<text x="1294" y="512" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  · ad hoc · misconfigured AP.</text>
<text x="1294" y="579" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Client mis-association · unauthorized</text>
<text x="1294" y="635" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  association · DoS/deauthentication · jamming.</text>
<text x="1294" y="691" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  [B6 s35–48, s84–86]</text>
<text x="1294" y="758" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Phòng vệ: WPA2 Enterprise; đổi SSID/password</text>
<text x="1294" y="814" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  mặc định; VPN/IPsec; phát hiện/chặn rogue AP;</text>
<text x="1294" y="870" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  Wireless IPS. [B6 s104–110]</text>
<text x="1290" y="959" font-family="Marker Felt, Noteworthy, cursive" font-size="46" fill="#a04642">PHẠM VI CUỐI KỲ</text>
<text x="1294" y="1025" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Bài 1 · 2A · 2B · 3A · 3B · 4 · 5 · 6; 4 lab; ý</text>
<text x="1294" y="1081" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  chính Quản lý rủi ro và Xu thế an ninh thông</text>
<text x="1294" y="1137" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  tin. [EXAM_PREP.pdf, trang 1]</text>
<text x="1294" y="1204" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Lab: nhớ mục đích, lệnh/công cụ, cách dùng;</text>
<text x="1294" y="1260" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  handout chưa có đủ trong repo.</text>
<text x="1294" y="1327" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Bài 1: ôn kỹ thuật tấn công, attacker, thứ tự</text>
<text x="1294" y="1383" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  hành động hacker, mô hình bảo mật. Slide Bài 1</text>
<text x="1294" y="1439" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  bị lỗi nên chi tiết chưa đối chiếu được.</text>
<text x="1290" y="1528" font-family="Marker Felt, Noteworthy, cursive" font-size="46" fill="#a04642">MẸO TRẮC NGHIỆM</text>
<text x="1294" y="1594" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Đọc từ khóa: thuật toán / khóa / kích thước /</text>
<text x="1294" y="1650" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  mục tiêu bảo mật / dấu hiệu gói tin.</text>
<text x="1294" y="1717" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Nhận diện hình: khóa dùng ở đâu, cờ TCP nào</text>
<text x="1294" y="1773" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  gửi, phản hồi nào xuất hiện.</text>
<text x="1294" y="1840" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Đề cương ghi: 40 câu · 75 phút · tham khảo 2 tờ</text>
<text x="1294" y="1896" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  A4 viết tay. [EXAM_PREP.pdf, trang 1]</text>
<path d="M145 3370 H2335" stroke="#b7c7d5" stroke-width="3"/>
<text x="145" y="3432" font-family="Noteworthy, Bradley Hand, cursive" font-size="29" fill="#63798e">Nguồn viết tắt: B2A/B2B/B3A/B3B/B4/B5/B6 = slide theo bài; xem exam-map.md.</text>
<text x="2332" y="3432" text-anchor="end" font-family="Noteworthy, Bradley Hand, cursive" font-size="30" fill="#63798e">4/4</text>
