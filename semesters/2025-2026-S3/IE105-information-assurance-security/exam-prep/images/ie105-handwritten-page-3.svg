<text x="145" y="132" font-family="Marker Felt, Noteworthy, cursive" font-size="44" fill="#315d83">IE105 · GHI CHÚ ÔN THI</text>
<text x="145" y="224" font-family="Marker Felt, Noteworthy, cursive" font-size="62" fill="#193f63">THĂM DÒ · QUÉT · MÃ ĐỘC</text>
<text x="145" y="294" font-family="Noteworthy, Bradley Hand, cursive" font-size="38" fill="#52697e">Mặt 3/4 · Mẫu 4 mặt để in hai mặt trên 2 tờ A4</text>
<path d="M145 320 H2335" stroke="#829fb9" stroke-width="4"/>
<path d="M1240 340 V3340" stroke="#d3dfe8" stroke-width="3"/>
<text x="145" y="390" font-family="Marker Felt, Noteworthy, cursive" font-size="46" fill="#a04642">THĂM DÒ (FOOTPRINTING)</text>
<text x="149" y="456" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Nguồn: WHOIS · DNS · network/traceroute ·</text>
<text x="149" y="512" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  website · email · Google hacking. [B3A s7]</text>
<text x="149" y="579" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Giảm lộ tin: split DNS, hạn chế zone transfer;</text>
<text x="149" y="635" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  tắt directory listing; Whois privacy; đào tạo</text>
<text x="149" y="691" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  chống social engineering. [B3A s52–53]</text>
<text x="145" y="780" font-family="Marker Felt, Noteworthy, cursive" font-size="46" fill="#a04642">QUÉT MẠNG · PHƯƠNG PHÁP</text>
<text x="149" y="846" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Port scan · vulnerability scan · network scan.</text>
<text x="149" y="902" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  [B3B s4]</text>
<text x="149" y="969" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Thứ tự: live systems → open ports → banner</text>
<text x="149" y="1025" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  grabbing → vulnerability → vẽ sơ đồ → proxy.</text>
<text x="149" y="1081" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  [B3B s5]</text>
<text x="149" y="1148" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• TCP connect: bắt tay 3 bước xong rồi gửi RST.</text>
<text x="149" y="1215" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Stealth / half-open: gửi SYN, không bắt tay</text>
<text x="149" y="1271" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  xong; SYN/ACK = mở, RST = đóng.</text>
<text x="149" y="1338" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• XMAS: FIN+URG+PSH. FIN: cờ FIN. NULL: không cờ.</text>
<text x="149" y="1394" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  Im lặng = có thể mở; RST = đóng.</text>
<text x="149" y="1461" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• ACK: im lặng = bị lọc / có firewall; RST =</text>
<text x="149" y="1517" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  không lọc.</text>
<text x="149" y="1584" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• UDP: ICMP port unreachable = đóng; im lặng = có</text>
<text x="149" y="1640" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  thể mở. [B3B s16–24]</text>
<text x="145" y="1729" font-family="Marker Felt, Noteworthy, cursive" font-size="46" fill="#a04642">LƯU Ý SCAN</text>
<text x="149" y="1795" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• XMAS / FIN / NULL dựa RFC 793; không hiệu quả</text>
<text x="149" y="1851" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  với Windows hiện tại. [B3B s18–20]</text>
<text x="149" y="1918" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Nhìn cờ TCP + phản hồi để nhận diện method /</text>
<text x="149" y="1974" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  trạng thái port.</text>
<text x="1290" y="390" font-family="Marker Felt, Noteworthy, cursive" font-size="46" fill="#a04642">MẬT KHẨU &amp; SYSTEM HACKING</text>
<text x="1294" y="456" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Mật khẩu mạnh: dài, nhiều loại ký tự; tránh từ</text>
<text x="1294" y="512" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  điển, tên, ngày sinh. [B4 s8, s28]</text>
<text x="1294" y="579" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Phòng vệ: 8–12 ký tự hỗn hợp; không tái dùng;</text>
<text x="1294" y="635" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  đổi định kỳ; theo dõi log; không lưu ở chỗ</text>
<text x="1294" y="691" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  không bảo vệ. [B4 s28]</text>
<text x="1294" y="758" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Keylogger ghi phím. Spyware theo dõi hoạt động</text>
<text x="1294" y="814" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  bí mật. [B4 s14, s39, s45]</text>
<text x="1294" y="881" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Dumpster diving: tìm tin trong rác. NTFS</text>
<text x="1294" y="937" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  alternate data stream có thể giấu dữ liệu.</text>
<text x="1294" y="1004" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• 5 giai đoạn: gaining access → escalating</text>
<text x="1294" y="1060" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  privileges → executing applications → hiding</text>
<text x="1294" y="1116" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  files → covering tracks. [B4 s4]</text>
<text x="1290" y="1205" font-family="Marker Felt, Noteworthy, cursive" font-size="46" fill="#a04642">MÃ ĐỘC</text>
<text x="1294" y="1271" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Vòng đời: Delivery/Infection → Execution →</text>
<text x="1294" y="1327" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  Persistence → Lateral Movement → C2 → Actions</text>
<text x="1294" y="1383" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  on Objectives. [B5 s13]</text>
<text x="1294" y="1450" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Static analysis: không chạy mẫu; xem cấu trúc</text>
<text x="1294" y="1506" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  file, strings, import/API, hash.</text>
<text x="1294" y="1573" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Dynamic analysis: chạy mẫu trong sandbox cô</text>
<text x="1294" y="1629" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  lập; quan sát process, file, registry, network.</text>
<text x="1294" y="1685" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  [B5 s59–105]</text>
<text x="1294" y="1752" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• IoC: dấu hiệu mức system · network · file ·</text>
<text x="1294" y="1808" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  behavior. [B5 s49–58]</text>
<text x="1294" y="1875" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Phát hiện: signature (khó bắt biến thể) ·</text>
<text x="1294" y="1931" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  behavior · ML · sandbox. [B5 s110–111]</text>
<text x="1294" y="1998" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Phòng chống: lớp người dùng · hệ thống · mạng.</text>
<text x="1294" y="2054" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  [B5 s106–109]</text>
<path d="M145 3370 H2335" stroke="#b7c7d5" stroke-width="3"/>
