<text x="145" y="132" font-family="Marker Felt, Noteworthy, cursive" font-size="44" fill="#315d83">IE105 · GHI CHÚ ÔN THI</text>
<text x="145" y="224" font-family="Marker Felt, Noteworthy, cursive" font-size="62" fill="#193f63">CHỨNG THỰC · HASH · CHỮ KÝ SỐ</text>
<text x="145" y="294" font-family="Noteworthy, Bradley Hand, cursive" font-size="38" fill="#52697e">Mặt 2/4 · Mẫu 4 mặt để in hai mặt trên 2 tờ A4</text>
<path d="M145 320 H2335" stroke="#829fb9" stroke-width="4"/>
<path d="M1240 340 V3340" stroke="#d3dfe8" stroke-width="3"/>
<text x="145" y="390" font-family="Marker Felt, Noteworthy, cursive" font-size="46" fill="#a04642">4 CÁCH MÃ HÓA THÔNG ĐIỆP</text>
<text x="149" y="456" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• E(K, M), khóa chung → bảo mật ✓, chứng thực ✓,</text>
<text x="149" y="512" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  chữ ký số ✗. Bên nhận cũng giữ K nên có thể giả</text>
<text x="149" y="568" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  mạo.</text>
<text x="149" y="635" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• E(PU_b, M) → bảo mật ✓, chứng thực ✗, chữ ký số</text>
<text x="149" y="691" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  ✗.</text>
<text x="149" y="758" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• E(PR_a, M) → bảo mật ✗, chứng thực ✓, chữ ký số</text>
<text x="149" y="814" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  ✓.</text>
<text x="149" y="881" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• E(PU_b, E(PR_a, M)) → bảo mật ✓, chứng thực ✓,</text>
<text x="149" y="937" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  chữ ký số ✓.</text>
<text x="149" y="1004" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Muốn vừa bảo mật vừa chứng thực: ký bằng</text>
<text x="149" y="1060" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  private key người gửi, rồi mã hóa bằng public</text>
<text x="149" y="1116" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  key người nhận. [B2B s17–21]</text>
<text x="145" y="1205" font-family="Marker Felt, Noteworthy, cursive" font-size="46" fill="#a04642">CHỮ KÝ SỐ · KÝ VÀ KIỂM</text>
<text x="149" y="1271" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Ký: băm M → mã digest bằng private key người</text>
<text x="149" y="1327" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  gửi → gửi M kèm chữ ký.</text>
<text x="149" y="1394" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Kiểm: dùng public key người gửi giải chữ ký; tự</text>
<text x="149" y="1450" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  băm M nhận; so sánh hai digest.</text>
<text x="149" y="1517" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Trùng nhau → nội dung không đổi, chữ ký khớp</text>
<text x="149" y="1573" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  người gửi. Chữ ký số không che nội dung. [B2B</text>
<text x="149" y="1629" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  s50–52]</text>
<text x="145" y="1718" font-family="Marker Felt, Noteworthy, cursive" font-size="46" fill="#a04642">HASH VÀ MAC</text>
<text x="149" y="1784" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Hash không dùng khóa. MAC = C(K, M): hai bên</text>
<text x="149" y="1840" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  dùng chung khóa bí mật.</text>
<text x="149" y="1907" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Cryptographic hash function cần tính một chiều</text>
<text x="149" y="1963" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  + kháng đụng độ.</text>
<text x="149" y="2030" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Đổi một ký tự → hash thay đổi mạnh. [B2B s22,</text>
<text x="149" y="2086" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  s35, s37, s45–49]</text>
<text x="149" y="2153" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• MD5 128 bit · SHA-1 160 bit · SHA-2</text>
<text x="149" y="2209" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  224/256/384/512 bit · SHA-3 = Keccak.</text>
<text x="149" y="2276" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• MD5 và SHA-1 không còn kháng đụng độ. [B2B</text>
<text x="149" y="2332" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  s46–49]</text>
<text x="1290" y="390" font-family="Marker Felt, Noteworthy, cursive" font-size="46" fill="#a04642">6 CÔNG DỤNG HASH</text>
<text x="1294" y="456" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Ký hiệu: M thông điệp; H hash; S bí mật chung;</text>
<text x="1294" y="512" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  PR_a private key A; ‖ là nối.</text>
<text x="1294" y="579" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• a) E(K, [M ‖ H(M)]) → bảo mật + chứng thực.</text>
<text x="1294" y="646" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• b) M ‖ E(K, H(M)) → chứng thực, không bảo mật.</text>
<text x="1294" y="713" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• c) M ‖ E(PR_a, H(M)) → chứng thực + chữ ký số.</text>
<text x="1294" y="780" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• d) E(K, [M ‖ E(PR_a, H(M))]) → cả 3 mục tiêu.</text>
<text x="1294" y="847" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• e) M ‖ H(M ‖ S) → chứng thực; không bảo mật,</text>
<text x="1294" y="903" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  không chữ ký số.</text>
<text x="1294" y="970" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• f) E(K, [M ‖ H(M ‖ S)]) → bảo mật + chứng thực.</text>
<text x="1294" y="1026" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  [B2B s40–44]</text>
<text x="1290" y="1115" font-family="Marker Felt, Noteworthy, cursive" font-size="46" fill="#a04642">MẸO NHẬN DIỆN</text>
<text x="1294" y="1181" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• E(K, …) bao ngoài → có bảo mật.</text>
<text x="1294" y="1248" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• E(PR_a, …) → có chữ ký số.</text>
<text x="1294" y="1315" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• S nằm trong H(… ‖ S) → chứng thực nhờ bí mật</text>
<text x="1294" y="1371" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  chung.</text>
<text x="1294" y="1438" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Hash đơn thuần không chứng minh ai gửi: ai cũng</text>
<text x="1294" y="1494" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  tính được H(M).</text>
<text x="1290" y="1583" font-family="Marker Felt, Noteworthy, cursive" font-size="46" fill="#a04642">3 MỤC TIÊU</text>
<text x="1294" y="1649" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Bảo mật: chỉ người có khóa phù hợp đọc nội</text>
<text x="1294" y="1705" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  dung.</text>
<text x="1294" y="1772" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Chứng thực: kiểm tra nguồn gửi / toàn vẹn theo</text>
<text x="1294" y="1828" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  cơ chế có khóa.</text>
<text x="1294" y="1895" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">• Chữ ký số: xác minh người ký bằng public key;</text>
<text x="1294" y="1951" font-family="Noteworthy, Bradley Hand, cursive" font-size="42" fill="#263f5a">  người ký khó chối bỏ.</text>
<path d="M145 3370 H2335" stroke="#b7c7d5" stroke-width="3"/>
<text x="145" y="3432" font-family="Noteworthy, Bradley Hand, cursive" font-size="29" fill="#63798e">Nguồn viết tắt: B2A/B2B/B3A/B3B/B4/B5/B6 = slide theo bài; xem exam-map.md.</text>
<text x="2332" y="3432" text-anchor="end" font-family="Noteworthy, Bradley Hand, cursive" font-size="30" fill="#63798e">2/4</text>
