<rect x="40" y="70" width="700" height="280" fill="none" stroke="#2f5496" stroke-width="2"/>
<text x="40" y="374" font-size="11" fill="#777777">Suy từ cột &quot;cấp&quot; ở bảng b: SysAdmin (server role) chỉ nhận login; db_owner/db_accessadmin (database role) chỉ cần database user.</text>
<text x="40" y="392" font-size="11" fill="#777777">* u2, u3: role chỉ cần database user, nhưng user đó vẫn phải map tới một login hoặc tạo WITHOUT LOGIN.</text>
<text x="40" y="410" font-size="11" fill="#777777">Điền tên CSDL thực hành cụ thể của bạn vào cột cuối thay vì để chung chung.</text>
</svg>