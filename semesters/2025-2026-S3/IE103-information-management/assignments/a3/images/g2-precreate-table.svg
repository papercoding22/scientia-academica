<text x="425.0" y="175.0" font-size="15" text-anchor="middle" fill="#1a1a1a">gián tiếp *</text>
<text x="635.0" y="175.0" font-size="15" text-anchor="middle" fill="#1a1a1a">có, trong CSDL thực hành</text>
<rect x="40" y="190" width="700" height="40" fill="#f2f6fc"/>
<text x="75.0" y="215.0" font-size="15" text-anchor="middle" fill="#1a1a1a">u3</text>
