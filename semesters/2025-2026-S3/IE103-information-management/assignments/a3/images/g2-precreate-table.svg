<text x="425.0" y="215.0" font-size="15" text-anchor="middle" fill="#1a1a1a">gián tiếp *</text>
<text x="635.0" y="215.0" font-size="15" text-anchor="middle" fill="#1a1a1a">có, trong CSDL thực hành</text>
