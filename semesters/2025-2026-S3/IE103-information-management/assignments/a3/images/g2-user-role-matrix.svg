<svg xmlns="http://www.w3.org/2000/svg" width="520" height="400" viewBox="0 0 520 400" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="520" height="400" fill="#ffffff"/>
  <text x="260" y="32" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Ma trận thành viên user × role</text>
  <text x="260" y="52" font-size="12" text-anchor="middle" fill="#555555">IE103 · Bài tập 3 · Gói 2 (Xác thực và role)</text>

  <!-- header row -->
  <rect x="40" y="70" width="460" height="40" fill="#2f5496"/>
  <text x="90" y="95" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">user</text>
  <text x="200" y="95" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">r1</text>
  <text x="320" y="95" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">r2</text>
  <text x="440" y="95" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">r3</text>

  <!-- row backgrounds alternating -->
  <rect x="40" y="110" width="460" height="40" fill="#f2f6fc"/>
  <rect x="40" y="150" width="460" height="40" fill="#ffffff"/>
  <rect x="40" y="190" width="460" height="40" fill="#f2f6fc"/>
  <rect x="40" y="230" width="460" height="40" fill="#ffffff"/>
  <rect x="40" y="270" width="460" height="40" fill="#f2f6fc"/>
  <rect x="40" y="310" width="460" height="40" fill="#ffffff"/>

  <!-- row labels -->
  <text x="90" y="135" font-size="15" text-anchor="middle" fill="#1a1a1a">u1</text>
  <text x="90" y="175" font-size="15" text-anchor="middle" fill="#1a1a1a">u2</text>
  <text x="90" y="215" font-size="15" text-anchor="middle" fill="#1a1a1a">u3</text>
  <text x="90" y="255" font-size="15" text-anchor="middle" fill="#1a1a1a">u4</text>
  <text x="90" y="295" font-size="15" text-anchor="middle" fill="#1a1a1a">u5</text>
  <text x="90" y="335" font-size="15" text-anchor="middle" fill="#1a1a1a">u6</text>

  <!-- checkmarks: u1->r1, u2,u3->r2, u4,u5,u6->r3 -->
  <text x="200" y="135" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e8f4e">✔</text>
  <text x="320" y="175" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e8f4e">✔</text>
  <text x="320" y="215" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e8f4e">✔</text>
  <text x="440" y="255" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e8f4e">✔</text>
  <text x="440" y="295" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e8f4e">✔</text>
  <text x="440" y="335" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e8f4e">✔</text>

  <!-- grid lines -->
  <g stroke="#c9d6e8" stroke-width="1">
    <line x1="40" y1="70" x2="500" y2="70"/>
    <line x1="40" y1="110" x2="500" y2="110"/>
    <line x1="40" y1="150" x2="500" y2="150"/>
    <line x1="40" y1="190" x2="500" y2="190"/>
    <line x1="40" y1="230" x2="500" y2="230"/>
    <line x1="40" y1="270" x2="500" y2="270"/>
    <line x1="40" y1="310" x2="500" y2="310"/>
    <line x1="40" y1="350" x2="500" y2="350"/>
    <line x1="40" y1="70" x2="40" y2="350"/>
    <line x1="140" y1="70" x2="140" y2="350"/>
    <line x1="260" y1="70" x2="260" y2="350"/>
    <line x1="380" y1="70" x2="380" y2="350"/>
    <line x1="500" y1="70" x2="500" y2="350"/>
  </g>
  <rect x="40" y="70" width="460" height="280" fill="none" stroke="#2f5496" stroke-width="2"/>

  <text x="40" y="375" font-size="11" fill="#777777">Nguồn: đề gốc BTTH3 mục B "Xác thực người dùng" — mục "Tạo nhóm"</text>
  <text x="40" y="390" font-size="11" fill="#777777">Mỗi user chỉ thuộc đúng một role trong yêu cầu này.</text>
</svg>
